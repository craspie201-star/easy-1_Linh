<script>
/* ===== DỮ LIỆU (Bài 9) ===== */
const LID=9,DG="〇一二三四五六七八九";
const X={
W:[["工作","gōngzuò","làm việc; công việc"],["也","yě","cũng"],["律师","lǜshī","luật sư"],["老师","lǎoshī","giáo viên"],["们","men","hậu tố số nhiều"],["我们","wǒmen","chúng tôi"],["一家人","yījiārén","cả nhà"],["上海","Shànghǎi","Thượng Hải"],["独生女","dúshēngnǚ","con gái một"],["独生子","dúshēngzǐ","con trai một"],["商人","shāngrén","thương nhân"],["做","zuò","làm"],["秘书","mìshū","thư ký"],["护士","hùshi","y tá"],["医生","yīshēng","bác sĩ"],["经理","jīnglǐ","giám đốc"],["司机","sījī","tài xế"]],
RA:[["床","广","mái nhà"],["饭","饣","thức ăn"],["放","方","vuông"],["睡","目","mắt"],["校","木","gỗ"],["路","⻊","chân"]],
ST:[["想","trên – dưới"],["进","bao quanh"],["腿","trái – phải"],["裤","trái – phải"],["颜","trái – phải"]],
F:[["我爸爸工作，我妈妈 ___ 工作。","也",["和","们","做"]],["我 ___ 一家人住在上海。","们",["也","是","做"]],["你妈妈 ___ 什么工作？","做",["是","也","有"]],["我爸爸 ___ 律师。","是",["也","做","们"]]],
S:[[["我爸爸","是","律师"],"Bố tôi là luật sư."],[["我妈妈","也","工作"],"Mẹ tôi cũng đi làm."],[["我们","一家人","住","在","上海"],"Cả nhà chúng tôi sống ở Thượng Hải."],[["你妈妈","做","什么","工作"],"Mẹ bạn làm nghề gì?"],[["她","是","秘书"],"Bà ấy là thư ký."],[["你","有","兄弟姐妹","吗"],"Bạn có anh chị em không?"],[["我","是","独生女"],"Tôi là con gái một."]]};
const NP=[["老师","giáo viên","中国","Trung Quốc"],["律师","luật sư","美国","Mỹ"],["护士","y tá","加拿大","Canada"],["司机","tài xế","日本","Nhật Bản"],["经理","giám đốc","法国","Pháp"],["秘书","thư ký","德国","Đức"],["医生","bác sĩ","英国","Anh"]];
const JB=[...NP.map(p=>[p[0],p[1]]),["商人","thương nhân"]];
const QA=[["我家有五口人。","你家有几口人？"],["我住在上海。","你住在哪儿？"],["他是中国人。","他是哪国人？"],["她叫王天一。","她是谁？"],["我爸爸是律师。","你爸爸做什么工作？"],["我是独生女。","你有兄弟姐妹吗？"]];
const SG=[];

/* ===== HÀM TIỆN ÍCH ===== */
const $=s=>document.querySelector(s);
const R=a=>a[Math.random()*a.length|0];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cn=n=>n<10?DG[n]:n<20?"十"+(n%10?DG[n%10]:""):DG[n/10|0]+"十"+(n%10?DG[n%10]:"");
const wd=x=>"星期"+WD[(x+4)%7]; // 2/9/2006 là thứ Bảy
const pick=(arr,a,k=3)=>sh([...new Set(arr)].filter(x=>x!==a)).slice(0,k);
const mk=(q,a,wr,tip,big,py,sm)=>({t:"c",q,a,o:sh([a,...wr.slice(0,3)]),tip,big,py,sm});

/* ===== BỘ SINH CÂU HỎI ===== */
const G={
 vm:()=>{const W=X.W,w=R(W);return mk("Nghĩa của từ này là gì?",w[2],pick(W.map(x=>x[2]),w[2]),`${w[0]} (${w[1]}) = ${w[2]}`,w[0],w[1])},
 vr:()=>{const W=X.W,w=R(W);return mk("Chọn chữ Hán đúng cho nghĩa này:",w[0],pick(W.map(x=>x[0]),w[0]),`${w[2]} = ${w[0]} (${w[1]})`,w[2],"",1)},
 pm:()=>{const W=X.W,w=R(W);return mk("Chọn pinyin đúng:",w[1],pick(W.map(x=>x[1]),w[1]),`${w[0]} đọc là ${w[1]}`,w[0])},
 tf:()=>{const W=X.W,w=R(W),ok=Math.random()<.5,m=ok?w[2]:R(W.filter(x=>x[2]!==w[2]))[2];return mk("Đúng hay sai?",ok?"Đúng":"Sai",[ok?"Sai":"Đúng"],`${w[0]} (${w[1]}) = ${w[2]}`,`${w[0]} = ${m}`,"",1)},
 m:()=>({t:"m",p:sh(X.W).slice(0,5)}),
 fl:()=>{const x=R(X.F);return mk("Chọn từ điền vào chỗ trống:",x[1],x[2],x[0].replace("___",x[1]),x[0],"",1)},
 rad:()=>{const RA=X.RA,x=R(RA),f=r=>`${r[1]} (${r[2]})`;return mk("Bộ thủ của chữ này là gì?",f(x),pick(RA.map(f),f(x)),`${x[0]}: bộ ${x[1]} (${x[2]})`,x[0])},
 ord:()=>{const s=R(X.S);return {t:"o",w:sh(s[0]),a:s[0].join(""),vi:s[1],tip:s[0].join("")+" — "+s[1]}},
 st:()=>{const x=R(X.ST);return mk("Chữ này có cấu trúc nào?",x[1],pick(["trái – phải","trên – dưới","bao quanh"],x[1],2),`${x[0]}: ${x[1]}`,x[0])},
 job:()=>{const j=R(JB),a=`他是${j[0]}。`;return mk(`Người này là ${j[1]}. Chọn câu trả lời cho 他做什么工作？`,a,pick(JB.map(x=>`他是${x[0]}。`),a),`${a} (${j[1]})`)},
 nat:()=>{const p=R(NP),o=R(NP.filter(x=>x!==p)),ans=`她是${p[0]}。她是${p[2]}人。`;
  return mk(`Người này là ${p[1]}, quốc tịch ${p[3]}. Chọn câu giới thiệu:`,ans,pick([`她是${o[0]}。她是${p[2]}人。`,`她是${p[0]}。她是${o[2]}人。`,`她是${o[0]}。她是${o[2]}人。`],ans),ans)},
 qw:()=>{const x=R(QA);return mk("Chọn câu hỏi phù hợp với câu trả lời:",x[1],pick(QA.map(y=>y[1]),x[1]),`${x[0]} ← ${x[1]}`,x[0],"",1)},
 only:()=>{const g=R([["独生女","con gái"],["独生子","con trai"]]),o=g[0]=="独生女"?"独生子":"独生女",ans=`没有。我是${g[0]}。`;
  return mk(`Bạn là con một (${g[1]}). Trả lời 你有兄弟姐妹吗？`,ans,[`有。我是${g[0]}。`,`没有。我是${o}。`,"有。我有一个弟弟。"],ans)},
 _:0
};
const LV=[["Từ mới",["m","vm","vm","tf","vr","tf","vm","m"]],["Pinyin & chữ Hán",["pm","vr","pm","vr","pm","vr","pm","vr"]],["Nghề nghiệp",["job","job","nat","job","nat","fl","job","nat"]],["Hỏi & đáp",["qw","only","qw","only","qw","fl","only","qw"]],["Ghép câu",["ord","ord","ord","ord","ord","fl"]],["Bộ thủ & cấu trúc",["rad","st","rad","st","rad","st","rad","rad"]],["Boss",["vm","vr","job","nat","qw","only","ord","rad","st","fl"]]];

/* ===== LƯU TIẾN ĐỘ ===== */
let DB={users:{},cur:"",py:true,hard:false};
try{const j=JSON.parse(localStorage.getItem("es1l9b"));if(j&&j.users)DB=Object.assign(DB,j)}catch(e){}
let S={},st=null;
const save=()=>{try{localStorage.setItem("es1l9b",JSON.stringify(DB))}catch(e){}};
function use(n){DB.cur=n;S=DB.users[n]=DB.users[n]||{};S.done=S.done||{};S.acc=S.acc||{};S.xp=S.xp||0;S.streak=S.streak||0;save()}
if(DB.cur&&DB.users[DB.cur])use(DB.cur);else DB.cur="";

/* ===== MÀN HÌNH CHÍNH ===== */
function home(){
 if(st)clearInterval(st.iv);
 if(!DB.cur)return login();
 document.body.classList.toggle("nopy",!DB.py);
 const dn=k=>(S.done[k]||0)>=1,stars=k=>"★".repeat(S.done[k]||0)+"☆".repeat(3-(S.done[k]||0));
 const bd=(S.done[LID+"-2"]||0)>=3?["Bậc thầy nghề nghiệp"]:[];
 let h=`<h1>Bài ${LID} · Nghề nghiệp</h1><p class="sub">Easy Steps to Chinese 1 · Unit 3</p>
 <p class="sub">👤 Học sinh: <b>${DB.cur}</b></p>
 <div class="tools"><button class="tg" onclick="DB.py=!DB.py;save();home()">Pinyin: ${DB.py?"bật":"tắt"}</button><button class="tg" onclick="DB.hard=!DB.hard;save();home()">Chế độ: ${DB.hard?"Thử thách (3 ❤️)":"Luyện tập (không mất tim)"}</button><button class="tg" onclick="report()">📋 Báo cáo điểm</button><button class="tg" onclick="DB.cur='';save();home()">Đổi học sinh</button><button class="tg" onclick="resetMe()">Làm lại từ đầu</button></div>
 <p class="xp">⭐ ${S.xp} XP · 🔥 ${S.streak} ngày liên tiếp</p>${bd.length?`<div class="badges">${bd.map(b=>`<span class="bd">🏅 ${b}</span>`).join("")}</div>`:""}
 <section class="card"><h2>职业 Nghề nghiệp</h2><div class="note">也 đứng trước động từ: 我妈妈也工作。们 là hậu tố số nhiều: 我们. Từ để hỏi: 什么, 几, 哪国人, 哪儿, 吗, 谁.</div><div class="grid">`;
 LV.forEach((v,i)=>{const lock=i>0&&!dn(LID+"-"+(i-1));
  h+=`<button class="lv ${i==6?"boss":""}" ${lock?"disabled":""} onclick="play(${i})"><b>${i==6?"👹":i+1}</b><span>${v[0]}</span><em>${lock?"🔒":stars(LID+"-"+i)}</em></button>`});
 $("#app").innerHTML=h+`</div></section>`;scrollTo(0,0)}

/* ===== ĐIỀU KHIỂN LƯỢT CHƠI ===== */
function play(i){run(LV[i][1].map(g=>G[g]()),{key:LID+"-"+i,again:()=>play(i)})}
function run(qs,o){
 if(st)clearInterval(st.iv);
 st={qs,i:0,ok:0,hp:DB.hard&&!o.speed&&!o.review?3:99,hard:DB.hard&&!o.speed&&!o.review,combo:0,miss:[],pts:0,t:60,o,speed:o.speed};
 if(o.speed)st.iv=setInterval(()=>{st.t--;const e=$("#tm");if(e)e.textContent=st.t+"s";const b=$(".bar i");if(b)b.style.width=(60-st.t)/60*100+"%";if(st.t<=0)end()},1000);
 show()}
function quit(){if(confirm("Thoát màn chơi? Tiến độ màn này sẽ không được lưu."))home()}
function show(){
 if(st.speed&&!st.qs[st.i])st.qs[st.i]=G[R(SG)](R([5,6]));
 if((!st.speed&&st.i>=st.qs.length)||st.hp<=0)return end();
 const q=st.q=st.qs[st.i];st.lock=false;
 const pr=st.speed?(60-st.t)/60:st.i/st.qs.length;
 let h=`<div class="top"><button class="ghost" onclick="quit()" aria-label="Thoát">✕</button><div class="bar"><i style="width:${pr*100}%"></i></div><span>${st.hard?"❤️".repeat(st.hp):""}</span>${st.speed?`<b id="tm">${st.t}s</b><b>${st.pts}đ</b>`:""}</div><main>`;
 if(q.t=="c"){
  h+=`<p class="q">${q.q}</p>${q.big?`<div class="big ${q.sm?"s":""}">${q.big}${q.py?`<small class="py">${q.py}</small>`:""}</div>`:""}<div class="opts">${q.o.map((o,k)=>`<button class="opt" onclick="pickC(${k})">${o}</button>`).join("")}</div>`}
 if(q.t=="o"){
  st.pk=[];h+=`<p class="q">Sắp xếp thành câu: <i>${q.vi}</i></p><div id="ans" class="slot"></div><div id="pool" class="pool"></div><button class="go" onclick="chkO()">Kiểm tra</button>`}
 if(q.t=="m"){
  st.sel=null;st.n=0;st.mm=0;st.ls=sh(q.p.map((_,k)=>k));st.rs=sh(q.p.map((_,k)=>k));
  h+=`<p class="q">Nối chữ Hán với nghĩa tiếng Việt:</p><div class="mm"><div>${st.ls.map(k=>`<button id="l${k}" onclick="selM(${k})"><span class="zh">${q.p[k][0]}</span><span class="py">${q.p[k][1]}</span></button>`).join("")}</div><div>${st.rs.map(k=>`<button id="r${k}" onclick="mtch(${k})">${q.p[k][2]}</button>`).join("")}</div></div>`}
 $("#app").innerHTML=h+"</main>";
 if(q.t=="o")drawO()}
function res(ok,q,tip){
 if(st.lock)return;st.lock=true;
 if(ok){st.ok++;st.combo++;st.pts+=10+Math.min(st.combo,5)*2}else{st.combo=0;st.miss.push(q);if(st.hard)st.hp--}
 if(st.speed){setTimeout(()=>{st.i++;show()},ok?250:800);return}
 $("main").insertAdjacentHTML("beforeend",`<div class="fb ${ok?"good":"bad"}"><b>${ok?"Đúng rồi!"+(st.combo>2?" 🔥 combo ×"+st.combo:""):"Chưa đúng"}</b><p>${tip||""}</p><button class="go" onclick="st.i++;show()">${st.hp<=0?"Xem kết quả":"Tiếp tục"}</button></div>`);
 $(".fb .go").focus()}
function pickC(k){
 if(st.lock)return;const q=st.q,a=q.o[k],ok=a===q.a;
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.o[j]===q.a)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
 res(ok,q,q.tip)}
function drawO(){const q=st.q;
 $("#ans").innerHTML=st.pk.map(k=>`<button class="chip" onclick="st.pk=st.pk.filter(x=>x!=${k});drawO()">${q.w[k]}</button>`).join("");
 $("#pool").innerHTML=q.w.map((w,k)=>st.pk.includes(k)?"":`<button class="chip" onclick="st.pk.push(${k});drawO()">${w}</button>`).join("")}
function chkO(){
 if(st.lock||st.pk.length<st.q.w.length)return;
 res(st.pk.map(k=>st.q.w[k]).join("")===st.q.a,st.q,st.q.tip)}
function selM(k){if(st.lock)return;document.querySelectorAll("[id^=l]").forEach(b=>b.classList.remove("sel"));st.sel=k;$("#l"+k).classList.add("sel")}
function mtch(k){
 if(st.lock||st.sel===null)return;const b=$("#r"+k);
 if(k===st.sel){b.classList.add("ok");b.disabled=true;$("#l"+k).classList.add("ok");$("#l"+k).disabled=true;st.sel=null;st.n++;
  if(st.n==st.q.p.length)res(st.mm==0,st.q,st.mm?"Hoàn thành, nhưng có "+st.mm+" lần nối sai.":"Nối đúng hết!")}
 else{st.mm++;b.classList.add("no");setTimeout(()=>b.classList.remove("no"),500);if(st.hard){st.hp--;if(st.hp<=0){st.miss.push(st.q);st.lock=true;end()}}}}

/* ===== KẾT QUẢ ===== */
function end(){
 clearInterval(st.iv);const o=st.o,n=st.qs.length,dead=st.hp<=0;
 let s=0;
 if(st.speed)s=st.pts>=250?3:st.pts>=150?2:st.pts>=60?1:0;
 else if(!dead){const a=st.ok/n;s=a>=.9?3:a>=.7?2:a>=.5?1:0}
 if(!o.review){if(o.key&&!st.speed)S.acc[o.key]=Math.max(S.acc[o.key]||0,Math.round(st.ok/n*100));if(o.key&&s>0)S.done[o.key]=Math.max(S.done[o.key]||0,s);if(st.speed)S.best=Math.max(S.best||0,st.pts)}
 S.xp+=st.pts;
 const td=new Date().toDateString();
 if(S.last!==td){S.streak=S.last===new Date(Date.now()-864e5).toDateString()?S.streak+1:1;S.last=td}
 save();
 const miss=st.miss.filter(q=>q.t!="m");
 $("#app").innerHTML=`<div class="res card"><h2>${st.speed?"Hết giờ!":dead?"Hết tim":s>0?"Hoàn thành!":"Chưa đạt"}</h2><div class="stars">${"★".repeat(s)}${"☆".repeat(3-s)}</div>
 <p>${st.speed?`Điểm: <b>${st.pts}</b> (cao nhất ${S.best})`:`Đúng ${st.ok}/${n} · +${st.pts} XP`}</p>
 ${!st.speed&&s==0?"<p>Cần đúng ít nhất một nửa để qua màn.</p>":""}
 ${o.review?"":`<button class="go" onclick="st.o.again()">Chơi lại</button>`}
 ${miss.length&&!o.review?`<button class="go alt" onclick="run(sh(st.miss.filter(q=>q.t!='m')),{review:1,again:home})">Ôn lại ${miss.length} câu sai</button>`:""}
 <br><button class="go alt" onclick="home()">Về bản đồ</button></div>`}
/* ===== HỌC SINH, BÁO CÁO, LÀM LẠI ===== */
function login(){
 const us=Object.keys(DB.users);
 $("#app").innerHTML=`<h1>Chào mừng bạn!</h1><p class="sub">Nhập tên để lưu điểm của riêng bạn.</p><div class="card"><input id="nm" class="inp" maxlength="30" placeholder="Tên học sinh" onkeydown="if(event.key==='Enter')go()"><button class="go" onclick="go()">Bắt đầu học</button>${us.length?`<p>Hoặc chọn tên đã có trên máy này:</p><div class="tools">${us.map((u,i)=>`<button class="tg" onclick="use(Object.keys(DB.users)[${i}]);home()">${u}</button>`).join("")}</div>`:""}</div><button class="tg" onclick="report()">📋 Báo cáo cả lớp</button>`}
function go(){const n=$("#nm").value.trim().replace(/[<>"'&`]/g,"");if(!n){$("#nm").focus();return}use(n);home()}
function rep(u){const d=DB.users[u],c=Object.keys(d.done||{}).filter(k=>k!="u"&&d.done[k]>0).length;return `${u}: ${c}/7 màn đạt · ${d.xp||0} XP`}
function report(){
 const L=["BÁO CÁO BÀI 9 – NGHỀ NGHIỆP – "+new Date().toLocaleDateString("vi-VN"),"","TỔNG HỢP CẢ LỚP (các học sinh trên máy này):",...Object.keys(DB.users).map(rep)];
 if(DB.cur){L.push("","CHI TIẾT: "+DB.cur);
  for(const l of [LID]){L.push("Bài "+l+":");LV.forEach((v,i)=>{const k=l+"-"+i,s=S.done[k]||0;L.push(`  ${v[0]}: ${s?"★".repeat(s):"chưa đạt"}${S.acc[k]!=null?" ("+S.acc[k]+"% đúng)":""}`)})}
  }
 $("#app").innerHTML=`<h1>Báo cáo điểm</h1><p class="sub">Sao chép và gửi cho giáo viên (qua Zalo, email...).</p><div class="card"><textarea id="rp" readonly></textarea><button class="go" onclick="cp()">Sao chép kết quả</button> <span id="cm"></span></div><button class="go alt" onclick="home()">Quay lại</button> <button class="go alt" onclick="clearAll()">Xóa dữ liệu cả máy</button>`;
 $("#rp").value=L.join("\n")}
function cp(){const t=$("#rp");t.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}$("#cm").textContent=ok?"Đã sao chép!":"Chưa sao chép được, hãy nhấn giữ và chọn Sao chép."}
function resetMe(){if(confirm("Xóa toàn bộ điểm của "+DB.cur+" và làm lại từ đầu?")){delete DB.users[DB.cur];use(DB.cur);home()}}
function clearAll(){if(confirm("Xóa điểm của TẤT CẢ học sinh trên máy này?")){DB.users={};DB.cur="";save();home()}}
home();
</script></body></html>
<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Easy Steps 1 – Bài 10: Thời gian</title>
<style>
:root{--bg:#eaf3fb;--card:#fff;--ink:#14213d;--mut:#5c6b88;--red:#e63946;--jade:#1b9e77;--gold:#ffb703;--line:#cfdceb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1830;--card:#19264a;--ink:#eef3ff;--mut:#9fb0d3;--line:#2c3c66}}
:root[data-theme="dark"]{--bg:#0f1830;--card:#19264a;--ink:#eef3ff;--mut:#9fb0d3;--line:#2c3c66}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px}
button{font:inherit;color:inherit;cursor:pointer;min-height:44px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
body.nopy .py{display:none}
h1{font-size:26px;margin:0;line-height:1.2}h2{font-size:20px;margin:0 0 6px}
.sub,.xp{color:var(--mut);margin:4px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tg{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:6px 14px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:16px 0;border:2px solid var(--line)}
.note{background:color-mix(in srgb,var(--gold) 25%,var(--card));border-radius:10px;padding:8px 12px;margin:8px 0 12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.lv{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px}
.lv b{font-size:22px}.lv em{font-style:normal;color:var(--gold)}
.lv.boss{border-color:var(--red)}.lv:disabled{opacity:.45;cursor:not-allowed}
.badges{display:flex;gap:8px;flex-wrap:wrap}.bd{background:var(--gold);color:#14213d;border-radius:20px;padding:4px 12px;font-size:14px;font-weight:700}
.top{display:flex;align-items:center;gap:10px}
.ghost{background:none;border:2px solid var(--line);border-radius:12px;padding:0 12px}
.bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--jade);transition:width .3s}
.q{font-size:18px;margin:18px 0 4px}
.big{font-size:56px;text-align:center;line-height:1.25;margin:8px 0}.big small{display:block;font-size:18px;color:var(--mut)}
.big.s{font-size:30px}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:20px;text-align:left}
.opt.right{border-color:var(--jade);background:color-mix(in srgb,var(--jade) 20%,var(--card))}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 20%,var(--card))}
.slot,.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:6px;margin-top:10px;border-radius:12px}
.slot{border:2px dashed var(--line)}
.chip{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px 14px;font-size:22px}
.mm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mm button{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px;font-size:18px;margin-bottom:8px;width:100%}
.mm .zh{font-size:28px}.mm .py{display:block;font-size:13px;color:var(--mut)}
.mm .sel{border-color:var(--gold)}.mm .ok{border-color:var(--jade);opacity:.5}.mm .no{border-color:var(--red)}
.fb{margin-top:16px;padding:14px;border-radius:14px}
.fb.good{background:color-mix(in srgb,var(--jade) 22%,var(--card))}.fb.bad{background:color-mix(in srgb,var(--red) 20%,var(--card))}
.fb p{margin:6px 0 10px}
.go{background:var(--red);color:#fff;border:0;border-radius:12px;padding:10px 22px;font-weight:700;margin-top:12px}
.go.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.res{text-align:center}.stars{font-size:48px;color:var(--gold)}
.inp{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:20px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
#rp{width:100%;box-sizing:border-box;min-height:300px;font:14px/1.5 ui-monospace,monospace;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body><div id="app"></div>
<script>
/* ===== DỮ LIỆU (Bài 10) ===== */
const LID=10,DG="〇一二三四五六七八九";
const h2=h=>h==2?"两":cn(h);
const mw=m=>m==0?"点":m==15?"点一刻":m==30?"点半":m==45?"点三刻":m<10?"点零"+cn(m)+"分":"点"+cn(m)+"分";
const tz=(h,m)=>h2(h)+mw(m);
const ms=[0,5,10,15,20,25,30,35,40,45,50,55],pad=m=>String(m).padStart(2,"0");
const X={
W:[["点","diǎn","giờ"],["零","líng","số không"],["分","fēn","phút"],["刻","kè","khắc (15 phút)"],["两","liǎng","hai (khi đếm)"],["现在","xiànzài","bây giờ"],["表","biǎo","đồng hồ đeo tay"],["差","chà","kém, thiếu"],["半","bàn","nửa"]],
RA:[["地","土","đất"],["友","又","lại"],["色","⺈","dao gập"],["粉","米","gạo"],["影","彡","trang trí"],["衬","衤","quần áo"]],
F:[["现在几 ___？","点",["分","刻","零"]],["九点一 ___。","刻",["点","分","两"]],["2:30 → ___ 点半。","两",["二","零","三"]],["六点 ___ 五分。(6:05)","零",["两","一","十"]],["你的表几点 ___？","了",["的","吗","呢"]],["___ 十分七点。(6:50)","差",["有","没","点"]]],
S:[[["现在","几点"],"Bây giờ mấy giờ?"],[["两点","三刻"],"Hai giờ bốn lăm."],[["你的表","几点","了"],"Đồng hồ của bạn mấy giờ rồi?"],[["差","十分","七点"],"Bảy giờ kém mười."],[["七点","十分"],"Bảy giờ mười phút."],[["九点","一刻"],"Chín giờ mười lăm."],[["六点","零五分"],"Sáu giờ năm phút."]]};
const SG=[];

/* ===== HÀM TIỆN ÍCH ===== */
const $=s=>document.querySelector(s);
const R=a=>a[Math.random()*a.length|0];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cn=n=>n<10?DG[n]:n<20?"十"+(n%10?DG[n%10]:""):DG[n/10|0]+"十"+(n%10?DG[n%10]:"");
const wd=x=>"星期"+WD[(x+4)%7]; // 2/9/2006 là thứ Bảy
const pick=(arr,a,k=3)=>sh([...new Set(arr)].filter(x=>x!==a)).slice(0,k);
const mk=(q,a,wr,tip,big,py,sm)=>({t:"c",q,a,o:sh([a,...wr.slice(0,3)]),tip,big,py,sm});

/* ===== BỘ SINH CÂU HỎI ===== */
const G={
 vm:()=>{const W=X.W,w=R(W);return mk("Nghĩa của từ này là gì?",w[2],pick(W.map(x=>x[2]),w[2]),`${w[0]} (${w[1]}) = ${w[2]}`,w[0],w[1])},
 vr:()=>{const W=X.W,w=R(W);return mk("Chọn chữ Hán đúng cho nghĩa này:",w[0],pick(W.map(x=>x[0]),w[0]),`${w[2]} = ${w[0]} (${w[1]})`,w[2],"",1)},
 pm:()=>{const W=X.W,w=R(W);return mk("Chọn pinyin đúng:",w[1],pick(W.map(x=>x[1]),w[1]),`${w[0]} đọc là ${w[1]}`,w[0])},
 tf:()=>{const W=X.W,w=R(W),ok=Math.random()<.5,m=ok?w[2]:R(W.filter(x=>x[2]!==w[2]))[2];return mk("Đúng hay sai?",ok?"Đúng":"Sai",[ok?"Sai":"Đúng"],`${w[0]} (${w[1]}) = ${w[2]}`,`${w[0]} = ${m}`,"",1)},
 m:()=>({t:"m",p:sh(X.W).slice(0,5)}),
 fl:()=>{const x=R(X.F);return mk("Chọn từ điền vào chỗ trống:",x[1],x[2],x[0].replace("___",x[1]),x[0],"",1)},
 rad:()=>{const RA=X.RA,x=R(RA),f=r=>`${r[1]} (${r[2]})`;return mk("Bộ thủ của chữ này là gì?",f(x),pick(RA.map(f),f(x)),`${x[0]}: bộ ${x[1]} (${x[2]})`,x[0])},
 ord:()=>{const s=R(X.S);return {t:"o",w:sh(s[0]),a:s[0].join(""),vi:s[1],tip:s[0].join("")+" — "+s[1]}},
 st:()=>{const x=R(X.ST);return mk("Chữ này có cấu trúc nào?",x[1],pick(["trái – phải","trên – dưới","bao quanh"],x[1],2),`${x[0]}: ${x[1]}`,x[0])},
 tm:()=>{const h=1+Math.random()*12|0,m=R(ms),dg=`${h}:${pad(m)}`,ans=tz(h,m),w2=h==2?[ans.replace("两","二")]:[];
  return mk("Chọn cách đọc giờ đúng:",ans,pick([...w2,tz(h,R(ms.filter(x=>x!=m))),tz(h%12+1,m),tz(1+Math.random()*12|0,R(ms))],ans),`${dg} → ${ans}`,dg,"",1)},
 tr:()=>{const h=1+Math.random()*12|0,m=R(ms),dg=`${h}:${pad(m)}`,t=tz(h,m);
  return mk("Chọn giờ đúng (dạng số):",dg,pick([`${h}:${pad(R(ms.filter(x=>x!=m)))}`,`${h%12+1}:${pad(m)}`,`${1+Math.random()*12|0}:${pad(R(ms))}`],dg),`${t} → ${dg}`,t,"",1)},
 ch:()=>{const h=1+Math.random()*12|0,d=R([5,10]),pv=(h+10)%12+1,dg=`${pv}:${pad(60-d)}`,ans=`差${cn(d)}分${h2(h)}点`;
  return mk("Chọn cách đọc kiểu 差 (kém):",ans,pick([`${h2(pv)}点${cn(60-d)}分`,`差${cn(d==5?10:5)}分${h2(h)}点`,`差${cn(d)}分${h2(pv)}点`],ans),`${dg} = ${ans} (${h} giờ kém ${d} phút)`,dg,"",1)},
 mul:()=>{const a=2+Math.random()*8|0,b=2+Math.random()*8|0,p=a*b;return mk("Đọc kết quả bằng chữ Hán:",cn(p),pick([p-1,p+1,p+10,p-10,(a+1)*b].filter(x=>x>0&&x<100&&x!=p).map(cn),cn(p)),`${a} × ${b} = ${p} → ${cn(p)}`,`${a} × ${b} = ?`,"",1)},
 _:0
};
const LV=[["Từ mới",["m","vm","vm","tf","vr","tf","vm","m"]],["Pinyin & chữ Hán",["pm","vr","pm","vr","pm","vr","pm","vr"]],["Đọc giờ",["tm","tm","tr","tm","tr","tm","tr","tm"]],["Kém giờ & số",["ch","ch","tm","ch","mul","mul","fl","tr"]],["Ghép câu",["ord","ord","ord","ord","ord","fl"]],["Bộ thủ",["rad","rad","rad","rad","rad","rad","rad","rad"]],["Boss",["vm","vr","tm","tr","ch","mul","ord","rad","fl","tf"]]];

/* ===== LƯU TIẾN ĐỘ ===== */
let DB={users:{},cur:"",py:true,hard:false};
try{const j=JSON.parse(localStorage.getItem("es1l10b"));if(j&&j.users)DB=Object.assign(DB,j)}catch(e){}
let S={},st=null;
const save=()=>{try{localStorage.setItem("es1l10b",JSON.stringify(DB))}catch(e){}};
function use(n){DB.cur=n;S=DB.users[n]=DB.users[n]||{};S.done=S.done||{};S.acc=S.acc||{};S.xp=S.xp||0;S.streak=S.streak||0;save()}
if(DB.cur&&DB.users[DB.cur])use(DB.cur);else DB.cur="";

/* ===== MÀN HÌNH CHÍNH ===== */
function home(){
 if(st)clearInterval(st.iv);
 if(!DB.cur)return login();
 document.body.classList.toggle("nopy",!DB.py);
 const dn=k=>(S.done[k]||0)>=1,stars=k=>"★".repeat(S.done[k]||0)+"☆".repeat(3-(S.done[k]||0));
 const bd=(S.done[LID+"-2"]||0)>=3?["Chuyên gia đồng hồ"]:[];
 let h=`<h1>Bài ${LID} · Thời gian</h1><p class="sub">Easy Steps to Chinese 1 · Unit 4</p>
 <p class="sub">👤 Học sinh: <b>${DB.cur}</b></p>
 <div class="tools"><button class="tg" onclick="DB.py=!DB.py;save();home()">Pinyin: ${DB.py?"bật":"tắt"}</button><button class="tg" onclick="DB.hard=!DB.hard;save();home()">Chế độ: ${DB.hard?"Thử thách (3 ❤️)":"Luyện tập (không mất tim)"}</button><button class="tg" onclick="report()">📋 Báo cáo điểm</button><button class="tg" onclick="DB.cur='';save();home()">Đổi học sinh</button><button class="tg" onclick="resetMe()">Làm lại từ đầu</button></div>
 <p class="xp">⭐ ${S.xp} XP · 🔥 ${S.streak} ngày liên tiếp</p>${bd.length?`<div class="badges">${bd.map(b=>`<span class="bd">🏅 ${b}</span>`).join("")}</div>`:""}
 <section class="card"><h2>时间 Giờ giấc</h2><div class="note">两 dùng khi đếm giờ: 两点. 刻 = 15 phút (一刻, 三刻), 半 = 30 phút. Phút dưới 10 thêm 零: 六点零五分. 差十分七点 = 7 giờ kém 10.</div><div class="grid">`;
 LV.forEach((v,i)=>{const lock=i>0&&!dn(LID+"-"+(i-1));
  h+=`<button class="lv ${i==6?"boss":""}" ${lock?"disabled":""} onclick="play(${i})"><b>${i==6?"👹":i+1}</b><span>${v[0]}</span><em>${lock?"🔒":stars(LID+"-"+i)}</em></button>`});
 $("#app").innerHTML=h+`</div></section>`;scrollTo(0,0)}

/* ===== ĐIỀU KHIỂN LƯỢT CHƠI ===== */
function play(i){run(LV[i][1].map(g=>G[g]()),{key:LID+"-"+i,again:()=>play(i)})}
function run(qs,o){
 if(st)clearInterval(st.iv);
 st={qs,i:0,ok:0,hp:DB.hard&&!o.speed&&!o.review?3:99,hard:DB.hard&&!o.speed&&!o.review,combo:0,miss:[],pts:0,t:60,o,speed:o.speed};
 if(o.speed)st.iv=setInterval(()=>{st.t--;const e=$("#tm");if(e)e.textContent=st.t+"s";const b=$(".bar i");if(b)b.style.width=(60-st.t)/60*100+"%";if(st.t<=0)end()},1000);
 show()}
function quit(){if(confirm("Thoát màn chơi? Tiến độ màn này sẽ không được lưu."))home()}
function show(){
 if(st.speed&&!st.qs[st.i])st.qs[st.i]=G[R(SG)](R([5,6]));
 if((!st.speed&&st.i>=st.qs.length)||st.hp<=0)return end();
 const q=st.q=st.qs[st.i];st.lock=false;
 const pr=st.speed?(60-st.t)/60:st.i/st.qs.length;
 let h=`<div class="top"><button class="ghost" onclick="quit()" aria-label="Thoát">✕</button><div class="bar"><i style="width:${pr*100}%"></i></div><span>${st.hard?"❤️".repeat(st.hp):""}</span>${st.speed?`<b id="tm">${st.t}s</b><b>${st.pts}đ</b>`:""}</div><main>`;
 if(q.t=="c"){
  h+=`<p class="q">${q.q}</p>${q.big?`<div class="big ${q.sm?"s":""}">${q.big}${q.py?`<small class="py">${q.py}</small>`:""}</div>`:""}<div class="opts">${q.o.map((o,k)=>`<button class="opt" onclick="pickC(${k})">${o}</button>`).join("")}</div>`}
 if(q.t=="o"){
  st.pk=[];h+=`<p class="q">Sắp xếp thành câu: <i>${q.vi}</i></p><div id="ans" class="slot"></div><div id="pool" class="pool"></div><button class="go" onclick="chkO()">Kiểm tra</button>`}
 if(q.t=="m"){
  st.sel=null;st.n=0;st.mm=0;st.ls=sh(q.p.map((_,k)=>k));st.rs=sh(q.p.map((_,k)=>k));
  h+=`<p class="q">Nối chữ Hán với nghĩa tiếng Việt:</p><div class="mm"><div>${st.ls.map(k=>`<button id="l${k}" onclick="selM(${k})"><span class="zh">${q.p[k][0]}</span><span class="py">${q.p[k][1]}</span></button>`).join("")}</div><div>${st.rs.map(k=>`<button id="r${k}" onclick="mtch(${k})">${q.p[k][2]}</button>`).join("")}</div></div>`}
 $("#app").innerHTML=h+"</main>";
 if(q.t=="o")drawO()}
function res(ok,q,tip){
 if(st.lock)return;st.lock=true;
 if(ok){st.ok++;st.combo++;st.pts+=10+Math.min(st.combo,5)*2}else{st.combo=0;st.miss.push(q);if(st.hard)st.hp--}
 if(st.speed){setTimeout(()=>{st.i++;show()},ok?250:800);return}
 $("main").insertAdjacentHTML("beforeend",`<div class="fb ${ok?"good":"bad"}"><b>${ok?"Đúng rồi!"+(st.combo>2?" 🔥 combo ×"+st.combo:""):"Chưa đúng"}</b><p>${tip||""}</p><button class="go" onclick="st.i++;show()">${st.hp<=0?"Xem kết quả":"Tiếp tục"}</button></div>`);
 $(".fb .go").focus()}
function pickC(k){
 if(st.lock)return;const q=st.q,a=q.o[k],ok=a===q.a;
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.o[j]===q.a)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
 res(ok,q,q.tip)}
function drawO(){const q=st.q;
 $("#ans").innerHTML=st.pk.map(k=>`<button class="chip" onclick="st.pk=st.pk.filter(x=>x!=${k});drawO()">${q.w[k]}</button>`).join("");
 $("#pool").innerHTML=q.w.map((w,k)=>st.pk.includes(k)?"":`<button class="chip" onclick="st.pk.push(${k});drawO()">${w}</button>`).join("")}
function chkO(){
 if(st.lock||st.pk.length<st.q.w.length)return;
 res(st.pk.map(k=>st.q.w[k]).join("")===st.q.a,st.q,st.q.tip)}
function selM(k){if(st.lock)return;document.querySelectorAll("[id^=l]").forEach(b=>b.classList.remove("sel"));st.sel=k;$("#l"+k).classList.add("sel")}
function mtch(k){
 if(st.lock||st.sel===null)return;const b=$("#r"+k);
 if(k===st.sel){b.classList.add("ok");b.disabled=true;$("#l"+k).classList.add("ok");$("#l"+k).disabled=true;st.sel=null;st.n++;
  if(st.n==st.q.p.length)res(st.mm==0,st.q,st.mm?"Hoàn thành, nhưng có "+st.mm+" lần nối sai.":"Nối đúng hết!")}
 else{st.mm++;b.classList.add("no");setTimeout(()=>b.classList.remove("no"),500);if(st.hard){st.hp--;if(st.hp<=0){st.miss.push(st.q);st.lock=true;end()}}}}

/* ===== KẾT QUẢ ===== */
function end(){
 clearInterval(st.iv);const o=st.o,n=st.qs.length,dead=st.hp<=0;
 let s=0;
 if(st.speed)s=st.pts>=250?3:st.pts>=150?2:st.pts>=60?1:0;
 else if(!dead){const a=st.ok/n;s=a>=.9?3:a>=.7?2:a>=.5?1:0}
 if(!o.review){if(o.key&&!st.speed)S.acc[o.key]=Math.max(S.acc[o.key]||0,Math.round(st.ok/n*100));if(o.key&&s>0)S.done[o.key]=Math.max(S.done[o.key]||0,s);if(st.speed)S.best=Math.max(S.best||0,st.pts)}
 S.xp+=st.pts;
 const td=new Date().toDateString();
 if(S.last!==td){S.streak=S.last===new Date(Date.now()-864e5).toDateString()?S.streak+1:1;S.last=td}
 save();
 const miss=st.miss.filter(q=>q.t!="m");
 $("#app").innerHTML=`<div class="res card"><h2>${st.speed?"Hết giờ!":dead?"Hết tim":s>0?"Hoàn thành!":"Chưa đạt"}</h2><div class="stars">${"★".repeat(s)}${"☆".repeat(3-s)}</div>
 <p>${st.speed?`Điểm: <b>${st.pts}</b> (cao nhất ${S.best})`:`Đúng ${st.ok}/${n} · +${st.pts} XP`}</p>
 ${!st.speed&&s==0?"<p>Cần đúng ít nhất một nửa để qua màn.</p>":""}
 ${o.review?"":`<button class="go" onclick="st.o.again()">Chơi lại</button>`}
 ${miss.length&&!o.review?`<button class="go alt" onclick="run(sh(st.miss.filter(q=>q.t!='m')),{review:1,again:home})">Ôn lại ${miss.length} câu sai</button>`:""}
 <br><button class="go alt" onclick="home()">Về bản đồ</button></div>`}
/* ===== HỌC SINH, BÁO CÁO, LÀM LẠI ===== */
function login(){
 const us=Object.keys(DB.users);
 $("#app").innerHTML=`<h1>Chào mừng bạn!</h1><p class="sub">Nhập tên để lưu điểm của riêng bạn.</p><div class="card"><input id="nm" class="inp" maxlength="30" placeholder="Tên học sinh" onkeydown="if(event.key==='Enter')go()"><button class="go" onclick="go()">Bắt đầu học</button>${us.length?`<p>Hoặc chọn tên đã có trên máy này:</p><div class="tools">${us.map((u,i)=>`<button class="tg" onclick="use(Object.keys(DB.users)[${i}]);home()">${u}</button>`).join("")}</div>`:""}</div><button class="tg" onclick="report()">📋 Báo cáo cả lớp</button>`}
function go(){const n=$("#nm").value.trim().replace(/[<>"'&`]/g,"");if(!n){$("#nm").focus();return}use(n);home()}
function rep(u){const d=DB.users[u],c=Object.keys(d.done||{}).filter(k=>k!="u"&&d.done[k]>0).length;return `${u}: ${c}/7 màn đạt · ${d.xp||0} XP`}
function report(){
 const L=["BÁO CÁO BÀI 10 – THỜI GIAN – "+new Date().toLocaleDateString("vi-VN"),"","TỔNG HỢP CẢ LỚP (các học sinh trên máy này):",...Object.keys(DB.users).map(rep)];
 if(DB.cur){L.push("","CHI TIẾT: "+DB.cur);
  for(const l of [LID]){L.push("Bài "+l+":");LV.forEach((v,i)=>{const k=l+"-"+i,s=S.done[k]||0;L.push(`  ${v[0]}: ${s?"★".repeat(s):"chưa đạt"}${S.acc[k]!=null?" ("+S.acc[k]+"% đúng)":""}`)})}
  }
 $("#app").innerHTML=`<h1>Báo cáo điểm</h1><p class="sub">Sao chép và gửi cho giáo viên (qua Zalo, email...).</p><div class="card"><textarea id="rp" readonly></textarea><button class="go" onclick="cp()">Sao chép kết quả</button> <span id="cm"></span></div><button class="go alt" onclick="home()">Quay lại</button> <button class="go alt" onclick="clearAll()">Xóa dữ liệu cả máy</button>`;
 $("#rp").value=L.join("\n")}
function cp(){const t=$("#rp");t.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}$("#cm").textContent=ok?"Đã sao chép!":"Chưa sao chép được, hãy nhấn giữ và chọn Sao chép."}
function resetMe(){if(confirm("Xóa toàn bộ điểm của "+DB.cur+" và làm lại từ đầu?")){delete DB.users[DB.cur];use(DB.cur);home()}}
function clearAll(){if(confirm("Xóa điểm của TẤT CẢ học sinh trên máy này?")){DB.users={};DB.cur="";save();home()}}
home();
</script></body></html>
<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Easy Steps 1 – Bài 11: Sinh hoạt hằng ngày</title>
<style>
:root{--bg:#eaf3fb;--card:#fff;--ink:#14213d;--mut:#5c6b88;--red:#e63946;--jade:#1b9e77;--gold:#ffb703;--line:#cfdceb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1830;--card:#19264a;--ink:#eef3ff;--mut:#9fb0d3;--line:#2c3c66}}
:root[data-theme="dark"]{--bg:#0f1830;--card:#19264a;--ink:#eef3ff;--mut:#9fb0d3;--line:#2c3c66}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#app{max-width:720px;margin:0 auto;padding:16px}
button{font:inherit;color:inherit;cursor:pointer;min-height:44px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
body.nopy .py{display:none}
h1{font-size:26px;margin:0;line-height:1.2}h2{font-size:20px;margin:0 0 6px}
.sub,.xp{color:var(--mut);margin:4px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tg{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:6px 14px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:16px 0;border:2px solid var(--line)}
.note{background:color-mix(in srgb,var(--gold) 25%,var(--card));border-radius:10px;padding:8px 12px;margin:8px 0 12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.lv{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px}
.lv b{font-size:22px}.lv em{font-style:normal;color:var(--gold)}
.lv.boss{border-color:var(--red)}.lv:disabled{opacity:.45;cursor:not-allowed}
.badges{display:flex;gap:8px;flex-wrap:wrap}.bd{background:var(--gold);color:#14213d;border-radius:20px;padding:4px 12px;font-size:14px;font-weight:700}
.top{display:flex;align-items:center;gap:10px}
.ghost{background:none;border:2px solid var(--line);border-radius:12px;padding:0 12px}
.bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--jade);transition:width .3s}
.q{font-size:18px;margin:18px 0 4px}
.big{font-size:56px;text-align:center;line-height:1.25;margin:8px 0}.big small{display:block;font-size:18px;color:var(--mut)}
.big.s{font-size:30px}
.opts{display:grid;gap:10px;margin-top:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:20px;text-align:left}
.opt.right{border-color:var(--jade);background:color-mix(in srgb,var(--jade) 20%,var(--card))}

.slot,.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:6px;margin-top:10px;border-radius:12px}
.slot{border:2px dashed var(--line)}
.chip{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:6px 14px;font-size:22px}
.mm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mm button{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px;font-size:18px;margin-bottom:8px;width:100%}
.mm .zh{font-size:28px}.mm .py{display:block;font-size:13px;color:var(--mut)}
.mm .sel{border-color:var(--gold)}.mm .ok{border-color:var(--jade);opacity:.5}.mm .no{border-color:var(--red)}
.fb{margin-top:16px;padding:14px;border-radius:14px}
.fb.good{background:color-mix(in srgb,var(--jade) 22%,var(--card))}.fb.bad{background:color-mix(in srgb,var(--red) 20%,var(--card))}
.fb p{margin:6px 0 10px}
.go{background:var(--red);color:#fff;border:0;border-radius:12px;padding:10px 22px;font-weight:700;margin-top:12px}
.go.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.res{text-align:center}.stars{font-size:48px;color:var(--gold)}
.inp{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:20px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
#rp{width:100%;box-sizing:border-box;min-height:300px;font:14px/1.5 ui-monospace,monospace;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body><div id="app"></div>
<script>
/* ===== DỮ LIỆU (Bài 11) ===== */
const LID=11,DG="〇一二三四五六七八九";
const h2=h=>h==2?"两":cn(h);
const mw=m=>m==0?"点":m==15?"点一刻":m==30?"点半":m==45?"点三刻":m<10?"点零"+cn(m)+"分":"点"+cn(m)+"分";
const tz=(h,m)=>h2(h)+mw(m);
const ms=[0,5,10,15,20,25,30,35,40,45,50,55],pad=m=>String(m).padStart(2,"0");
const pdw=h=>h<9?"早上":h<12?"上午":h==12?"中午":h<18?"下午":"晚上",h12=h=>h%12||12,tz2=(h,m)=>pdw(h)+h2(h12(h))+mw(m);
const PDS=["早上","上午","中午","下午","晚上"];
const X={
W:[["早上","zǎoshang","buổi sáng sớm"],["上午","shàngwǔ","buổi sáng (trước trưa)"],["中午","zhōngwǔ","buổi trưa"],["下午","xiàwǔ","buổi chiều"],["晚上","wǎnshang","buổi tối"],["起床","qǐchuáng","thức dậy"],["吃","chī","ăn"],["早饭","zǎofàn","bữa sáng"],["午饭","wǔfàn","bữa trưa"],["晚饭","wǎnfàn","bữa tối"],["去","qù","đi"],["上学","shàngxué","đi học"],["上课","shàngkè","vào học"],["放学","fàngxué","tan học"],["睡觉","shuìjiào","đi ngủ"]],
RA:[["穿","穴","hang"],["短","矢","mũi tên"],["颜","页","trang"],["拉","扌","tay"],["英","艹","cỏ"],["起","走","đi bộ"]],
F:[["我早上六点半 ___。","起床",["睡觉","放学","上课"]],["我们八点 ___。","上课",["起床","睡觉","吃"]],["我们下午三点半 ___。","放学",["起床","上课","早饭"]],["我晚上九点半 ___。","睡觉",["起床","放学","吃"]],["我六点三刻吃 ___。","早饭",["上学","起床","睡觉"]],["我七点一刻 ___ 上学。","去",["吃","睡","放"]]],
S:[[["我","早上","六点半","起床"],"Sáng tôi dậy lúc 6 giờ rưỡi."],[["我","六点三刻","吃","早饭"],"Tôi ăn sáng lúc 6 giờ 45."],[["我","七点一刻","去","上学"],"Tôi đi học lúc 7 giờ 15."],[["我们","八点","上课"],"Chúng tôi vào học lúc 8 giờ."],[["我们","下午","三点半","放学"],"Chúng tôi tan học lúc 3 giờ rưỡi chiều."],[["我","晚上","九点半","睡觉"],"Tôi đi ngủ lúc 9 giờ rưỡi tối."],[["你","几点","睡觉"],"Bạn mấy giờ đi ngủ?"]]};
const RT=[["早上六点半","起床","thức dậy","6:30 sáng"],["六点三刻","吃早饭","ăn sáng","6:45"],["七点一刻","去上学","đi học","7:15"],["八点","上课","vào học","8:00"],["下午三点半","放学","tan học","3:30 chiều"],["晚上九点半","睡觉","đi ngủ","9:30 tối"]];
const AQ=[["thức dậy","你早上几点起床？"],["ăn sáng","你几点吃早饭？"],["đi học","你几点去上学？"],["vào học","你们几点上课？"],["ăn trưa","你中午几点吃午饭？"],["tan học","你们下午几点放学？"],["đi ngủ","你几点睡觉？"]];
const SG=[];

/* ===== HÀM TIỆN ÍCH ===== */
const $=s=>document.querySelector(s);
const R=a=>a[Math.random()*a.length|0];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cn=n=>n<10?DG[n]:n<20?"十"+(n%10?DG[n%10]:""):DG[n/10|0]+"十"+(n%10?DG[n%10]:"");
const wd=x=>"星期"+WD[(x+4)%7]; // 2/9/2006 là thứ Bảy
const pick=(arr,a,k=3)=>sh([...new Set(arr)].filter(x=>x!==a)).slice(0,k);
const mk=(q,a,wr,tip,big,py,sm)=>({t:"c",q,a,o:sh([a,...wr.slice(0,3)]),tip,big,py,sm});

/* ===== BỘ SINH CÂU HỎI ===== */
const G={
 vm:()=>{const W=X.W,w=R(W);return mk("Nghĩa của từ này là gì?",w[2],pick(W.map(x=>x[2]),w[2]),`${w[0]} (${w[1]}) = ${w[2]}`,w[0],w[1])},
 vr:()=>{const W=X.W,w=R(W);return mk("Chọn chữ Hán đúng cho nghĩa này:",w[0],pick(W.map(x=>x[0]),w[0]),`${w[2]} = ${w[0]} (${w[1]})`,w[2],"",1)},
 pm:()=>{const W=X.W,w=R(W);return mk("Chọn pinyin đúng:",w[1],pick(W.map(x=>x[1]),w[1]),`${w[0]} đọc là ${w[1]}`,w[0])},
 tf:()=>{const W=X.W,w=R(W),ok=Math.random()<.5,m=ok?w[2]:R(W.filter(x=>x[2]!==w[2]))[2];return mk("Đúng hay sai?",ok?"Đúng":"Sai",[ok?"Sai":"Đúng"],`${w[0]} (${w[1]}) = ${w[2]}`,`${w[0]} = ${m}`,"",1)},
 m:()=>({t:"m",p:sh(X.W).slice(0,5)}),
 fl:()=>{const x=R(X.F);return mk("Chọn từ điền vào chỗ trống:",x[1],x[2],x[0].replace("___",x[1]),x[0],"",1)},
 rad:()=>{const RA=X.RA,x=R(RA),f=r=>`${r[1]} (${r[2]})`;return mk("Bộ thủ của chữ này là gì?",f(x),pick(RA.map(f),f(x)),`${x[0]}: bộ ${x[1]} (${x[2]})`,x[0])},
 ord:()=>{const s=R(X.S);return {t:"o",w:sh(s[0]),a:s[0].join(""),vi:s[1],tip:s[0].join("")+" — "+s[1]}},
 st:()=>{const x=R(X.ST);return mk("Chữ này có cấu trúc nào?",x[1],pick(["trái – phải","trên – dưới","bao quanh"],x[1],2),`${x[0]}: ${x[1]}`,x[0])},
 pd:()=>{const H=[5,6,7,8,9,10,11,12,14,15,16,17,19,20,21,23],q=[0,5,15,30,45],h=R(H),m=R(q),dg=`${h}:${pad(m)}`,ans=tz2(h,m),op=PDS.filter(x=>x!=pdw(h));
  return mk("Chọn cách đọc giờ đúng:",ans,pick([R(op)+h2(h12(h))+mw(m),tz2(h,R(q.filter(x=>x!=m))),pdw(h)+h2(h12(R(H.filter(x=>x!=h))))+mw(m),R(op)+h2(h12(h))+mw(R(q))],ans),`${dg} → ${ans}`,dg,"",1)},
 rt:()=>{const x=R(RT),y=R(RT.filter(z=>z!=x)),ans=`我${x[0]}${x[1]}。`;
  return mk(`${x[2]} lúc ${x[3]}. Chọn câu đúng:`,ans,pick([`我${y[0]}${x[1]}。`,`我${x[0]}${y[1]}。`,`我${y[0]}${y[1]}。`],ans),ans)},
 ask:()=>{const x=R(AQ);return mk(`Chọn câu hỏi để hỏi về: ${x[0]}`,x[1],pick(AQ.map(y=>y[1]),x[1]),`${x[0]} → ${x[1]}`)},
 _:0
};
const LV=[["Từ mới",["m","vm","vm","tf","vr","tf","vm","m"]],["Pinyin & chữ Hán",["pm","vr","pm","vr","pm","vr","pm","vr"]],["Buổi trong ngày",["pd","pd","pd","pd","pd","rt","pd","rt"]],["Sinh hoạt",["rt","ask","rt","ask","fl","rt","ask","fl"]],["Ghép câu",["ord","ord","ord","ord","ord","fl"]],["Bộ thủ",["rad","rad","rad","rad","rad","rad","rad","rad"]],["Boss",["vm","vr","pd","rt","ask","pd","ord","rad","fl","tf"]]];

/* ===== LƯU TIẾN ĐỘ ===== */
let DB={users:{},cur:"",py:true,hard:false};
try{const j=JSON.parse(localStorage.getItem("es1l11b"));if(j&&j.users)DB=Object.assign(DB,j)}catch(e){}
let S={},st=null;
const save=()=>{try{localStorage.setItem("es1l11b",JSON.stringify(DB))}catch(e){}};
function use(n){DB.cur=n;S=DB.users[n]=DB.users[n]||{};S.done=S.done||{};S.acc=S.acc||{};S.xp=S.xp||0;S.streak=S.streak||0;save()}
if(DB.cur&&DB.users[DB.cur])use(DB.cur);else DB.cur="";

/* ===== MÀN HÌNH CHÍNH ===== */
function home(){
 if(st)clearInterval(st.iv);
 if(!DB.cur)return login();
 document.body.classList.toggle("nopy",!DB.py);
 const dn=k=>(S.done[k]||0)>=1,stars=k=>"★".repeat(S.done[k]||0)+"☆".repeat(3-(S.done[k]||0));
 const bd=(S.done[LID+"-2"]||0)>=3?["Dậy sớm học giỏi"]:[];
 let h=`<h1>Bài ${LID} · Sinh hoạt hằng ngày</h1><p class="sub">Easy Steps to Chinese 1 · Unit 4</p>
 <p class="sub">👤 Học sinh: <b>${DB.cur}</b></p>
 <div class="tools"><button class="tg" onclick="DB.py=!DB.py;save();home()">Pinyin: ${DB.py?"bật":"tắt"}</button><button class="tg" onclick="DB.hard=!DB.hard;save();home()">Chế độ: ${DB.hard?"Thử thách (3 ❤️)":"Luyện tập (không mất tim)"}</button><button class="tg" onclick="report()">📋 Báo cáo điểm</button><button class="tg" onclick="DB.cur='';save();home()">Đổi học sinh</button><button class="tg" onclick="resetMe()">Làm lại từ đầu</button></div>
 <p class="xp">⭐ ${S.xp} XP · 🔥 ${S.streak} ngày liên tiếp</p>${bd.length?`<div class="badges">${bd.map(b=>`<span class="bd">🏅 ${b}</span>`).join("")}</div>`:""}
 <section class="card"><h2>日常起居 Sinh hoạt hằng ngày</h2><div class="note">早上 5–8h, 上午 trước trưa, 中午 12h, 下午 chiều, 晚上 18–24h. Trạng ngữ thời gian đứng trước động từ: 我八点上课。</div><div class="grid">`;
 LV.forEach((v,i)=>{const lock=i>0&&!dn(LID+"-"+(i-1));
  h+=`<button class="lv ${i==6?"boss":""}" ${lock?"disabled":""} onclick="play(${i})"><b>${i==6?"👹":i+1}</b><span>${v[0]}</span><em>${lock?"🔒":stars(LID+"-"+i)}</em></button>`});
 $("#app").innerHTML=h+`</div></section>`;scrollTo(0,0)}

/* ===== ĐIỀU KHIỂN LƯỢT CHƠI ===== */
function play(i){run(LV[i][1].map(g=>G[g]()),{key:LID+"-"+i,again:()=>play(i)})}
function run(qs,o){
 if(st)clearInterval(st.iv);
 st={qs,i:0,ok:0,hp:DB.hard&&!o.speed&&!o.review?3:99,hard:DB.hard&&!o.speed&&!o.review,combo:0,miss:[],pts:0,t:60,o,speed:o.speed};
 if(o.speed)st.iv=setInterval(()=>{st.t--;const e=$("#tm");if(e)e.textContent=st.t+"s";const b=$(".bar i");if(b)b.style.width=(60-st.t)/60*100+"%";if(st.t<=0)end()},1000);
 show()}
function quit(){if(confirm("Thoát màn chơi? Tiến độ màn này sẽ không được lưu."))home()}
function show(){
 if(st.speed&&!st.qs[st.i])st.qs[st.i]=G[R(SG)](R([5,6]));
 if((!st.speed&&st.i>=st.qs.length)||st.hp<=0)return end();
 const q=st.q=st.qs[st.i];st.lock=false;
 const pr=st.speed?(60-st.t)/60:st.i/st.qs.length;
 let h=`<div class="top"><button class="ghost" onclick="quit()" aria-label="Thoát">✕</button><div class="bar"><i style="width:${pr*100}%"></i></div><span>${st.hard?"❤️".repeat(st.hp):""}</span>${st.speed?`<b id="tm">${st.t}s</b><b>${st.pts}đ</b>`:""}</div><main>`;
 if(q.t=="c"){
  h+=`<p class="q">${q.q}</p>${q.big?`<div class="big ${q.sm?"s":""}">${q.big}${q.py?`<small class="py">${q.py}</small>`:""}</div>`:""}<div class="opts">${q.o.map((o,k)=>`<button class="opt" onclick="pickC(${k})">${o}</button>`).join("")}</div>`}
 if(q.t=="o"){
  st.pk=[];h+=`<p class="q">Sắp xếp thành câu: <i>${q.vi}</i></p><div id="ans" class="slot"></div><div id="pool" class="pool"></div><button class="go" onclick="chkO()">Kiểm tra</button>`}
 if(q.t=="m"){
  st.sel=null;st.n=0;st.mm=0;st.ls=sh(q.p.map((_,k)=>k));st.rs=sh(q.p.map((_,k)=>k));
  h+=`<p class="q">Nối chữ Hán với nghĩa tiếng Việt:</p><div class="mm"><div>${st.ls.map(k=>`<button id="l${k}" onclick="selM(${k})"><span class="zh">${q.p[k][0]}</span><span class="py">${q.p[k][1]}</span></button>`).join("")}</div><div>${st.rs.map(k=>`<button id="r${k}" onclick="mtch(${k})">${q.p[k][2]}</button>`).join("")}</div></div>`}
 $("#app").innerHTML=h+"</main>";
 if(q.t=="o")drawO()}
function res(ok,q,tip){
 if(st.lock)return;st.lock=true;
 if(ok){st.ok++;st.combo++;st.pts+=10+Math.min(st.combo,5)*2}else{st.combo=0;st.miss.push(q);if(st.hard)st.hp--}
 if(st.speed){setTimeout(()=>{st.i++;show()},ok?250:800);return}
 $("main").insertAdjacentHTML("beforeend",`<div class="fb ${ok?"good":"bad"}"><b>${ok?"Đúng rồi!"+(st.combo>2?" 🔥 combo ×"+st.combo:""):"Chưa đúng"}</b><p>${tip||""}</p><button class="go" onclick="st.i++;show()">${st.hp<=0?"Xem kết quả":"Tiếp tục"}</button></div>`);
 $(".fb .go").focus()}
function pickC(k){
 if(st.lock)return;const q=st.q,a=q.o[k],ok=a===q.a;
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.o[j]===q.a)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
 res(ok,q,q.tip)}
function drawO(){const q=st.q;
 $("#ans").innerHTML=st.pk.map(k=>`<button class="chip" onclick="st.pk=st.pk.filter(x=>x!=${k});drawO()">${q.w[k]}</button>`).join("");
 $("#pool").innerHTML=q.w.map((w,k)=>st.pk.includes(k)?"":`<button class="chip" onclick="st.pk.push(${k});drawO()">${w}</button>`).join("")}
function chkO(){
 if(st.lock||st.pk.length<st.q.w.length)return;
 res(st.pk.map(k=>st.q.w[k]).join("")===st.q.a,st.q,st.q.tip)}
function selM(k){if(st.lock)return;document.querySelectorAll("[id^=l]").forEach(b=>b.classList.remove("sel"));st.sel=k;$("#l"+k).classList.add("sel")}
function mtch(k){
 if(st.lock||st.sel===null)return;const b=$("#r"+k);
 if(k===st.sel){b.classList.add("ok");b.disabled=true;$("#l"+k).classList.add("ok");$("#l"+k).disabled=true;st.sel=null;st.n++;
  if(st.n==st.q.p.length)res(st.mm==0,st.q,st.mm?"Hoàn thành, nhưng có "+st.mm+" lần nối sai.":"Nối đúng hết!")}
 else{st.mm++;b.classList.add("no");setTimeout(()=>b.classList.remove("no"),500);if(st.hard){st.hp--;if(st.hp<=0){st.miss.push(st.q);st.lock=true;end()}}}}

/* ===== KẾT QUẢ ===== */
function end(){
 clearInterval(st.iv);const o=st.o,n=st.qs.length,dead=st.hp<=0;
 let s=0;
 if(st.speed)s=st.pts>=250?3:st.pts>=150?2:st.pts>=60?1:0;
 else if(!dead){const a=st.ok/n;s=a>=.9?3:a>=.7?2:a>=.5?1:0}
 if(!o.review){if(o.key&&!st.speed)S.acc[o.key]=Math.max(S.acc[o.key]||0,Math.round(st.ok/n*100));if(o.key&&s>0)S.done[o.key]=Math.max(S.done[o.key]||0,s);if(st.speed)S.best=Math.max(S.best||0,st.pts)}
 S.xp+=st.pts;
 const td=new Date().toDateString();
 if(S.last!==td){S.streak=S.last===new Date(Date.now()-864e5).toDateString()?S.streak+1:1;S.last=td}
 save();
 const miss=st.miss.filter(q=>q.t!="m");
 $("#app").innerHTML=`<div class="res card"><h2>${st.speed?"Hết giờ!":dead?"Hết tim":s>0?"Hoàn thành!":"Chưa đạt"}</h2><div class="stars">${"★".repeat(s)}${"☆".repeat(3-s)}</div>
 <p>${st.speed?`Điểm: <b>${st.pts}</b> (cao nhất ${S.best})`:`Đúng ${st.ok}/${n} · +${st.pts} XP`}</p>
 ${!st.speed&&s==0?"<p>Cần đúng ít nhất một nửa để qua màn.</p>":""}
 ${o.review?"":`<button class="go" onclick="st.o.again()">Chơi lại</button>`}
 ${miss.length&&!o.review?`<button class="go alt" onclick="run(sh(st.miss.filter(q=>q.t!='m')),{review:1,again:home})">Ôn lại ${miss.length} câu sai</button>`:""}
 <br><button class="go alt" onclick="home()">Về bản đồ</button></div>`}
/* ===== HỌC SINH, BÁO CÁO, LÀM LẠI ===== */
function login(){
 const us=Object.keys(DB.users);
 $("#app").innerHTML=`<h1>Chào mừng bạn!</h1><p class="sub">Nhập tên để lưu điểm của riêng bạn.</p><div class="card"><input id="nm" class="inp" maxlength="30" placeholder="Tên học sinh" onkeydown="if(event.key==='Enter')go()"><button class="go" onclick="go()">Bắt đầu học</button>${us.length?`<p>Hoặc chọn tên đã có trên máy này:</p><div class="tools">${us.map((u,i)=>`<button class="tg" onclick="use(Object.keys(DB.users)[${i}]);home()">${u}</button>`).join("")}</div>`:""}</div><button class="tg" onclick="report()">📋 Báo cáo cả lớp</button>`}
function go(){const n=$("#nm").value.trim().replace(/[<>"'&`]/g,"");if(!n){$("#nm").focus();return}use(n);home()}
function rep(u){const d=DB.users[u],c=Object.keys(d.done||{}).filter(k=>k!="u"&&d.done[k]>0).length;return `${u}: ${c}/7 màn đạt · ${d.xp||0} XP`}
function report(){
 const L=["BÁO CÁO BÀI 11 – SINH HOẠT HẰNG NGÀY – "+new Date().toLocaleDateString("vi-VN"),"","TỔNG HỢP CẢ LỚP (các học sinh trên máy này):",...Object.keys(DB.users).map(rep)];
 if(DB.cur){L.push("","CHI TIẾT: "+DB.cur);
  for(const l of [LID]){L.push("Bài "+l+":");LV.forEach((v,i)=>{const k=l+"-"+i,s=S.done[k]||0;L.push(`  ${v[0]}: ${s?"★".repeat(s):"chưa đạt"}${S.acc[k]!=null?" ("+S.acc[k]+"% đúng)":""}`)})}
  }
 $("#app").innerHTML=`<h1>Báo cáo điểm</h1><p class="sub">Sao chép và gửi cho giáo viên (qua Zalo, email...).</p><div class="card"><textarea id="rp" readonly></textarea><button class="go" onclick="cp()">Sao chép kết quả</button> <span id="cm"></span></div><button class="go alt" onclick="home()">Quay lại</button> <button class="go alt" onclick="clearAll()">Xóa dữ liệu cả máy</button>`;
 $("#rp").value=L.join("\n")}
function cp(){const t=$("#rp");t.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}$("#cm").textContent=ok?"Đã sao chép!":"Chưa sao chép được, hãy nhấn giữ và chọn Sao chép."}
function resetMe(){if(confirm("Xóa toàn bộ điểm của "+DB.cur+" và làm lại từ đầu?")){delete DB.users[DB.cur];use(DB.cur);home()}}
function clearAll(){if(confirm("Xóa điểm của TẤT CẢ học sinh trên máy này?")){DB.users={};DB.cur="";save();home()}}
home();
</script></body></html>

<style>

<body><div id="app"></div>
<script>
/* ===== DỮ LIỆU (Bài 12) ===== */
const LID=12,DG="〇一二三四五六七八九";
const X={
W:[["开车","kāichē","lái xe"],["车","chē","xe"],["上班","shàngbān","đi làm"],["走路","zǒulù","đi bộ"],["每天","měitiān","mỗi ngày"],["坐","zuò","ngồi; đi (bằng phương tiện)"],["校车","xiàochē","xe buýt của trường"],["怎么","zěnme","thế nào, bằng cách nào"],["火车","huǒchē","tàu hỏa"],["出租车","chūzūchē","taxi"],["汽车","qìchē","ô tô"],["公共汽车","gōnggòng qìchē","xe buýt công cộng"],["地铁","dìtiě","tàu điện ngầm"],["电车","diànchē","xe điện"],["飞机","fēijī","máy bay"],["渡船","dùchuán","phà"],["下课","xiàkè","tan tiết"],["下班","xiàbān","tan làm"],["上车","shàngchē","lên xe"],["下车","xiàchē","xuống xe"]],
RA:[["数","攵","chữ viết"],["欢","欠","thiếu"],["喜","士","học giả"],["问","门","cửa"],["等","⺮","tre"],["铁","钅","kim loại"]],
F:[["我爸爸 ___ 上班。","开车",["走路","地铁","火车"]],["我妈妈 ___ 上班。","走路",["校车","开车","飞机"]],["我每天 ___ 校车上学。","坐",["开","走","放"]],["你爸爸 ___ 上班？","怎么",["几点","哪儿","吗"]],["我 ___ 地铁上学。","坐",["开","走","吃"]]],
S:[[["我爸爸","开车","上班"],"Bố tôi lái xe đi làm."],[["我妈妈","走路","上班"],"Mẹ tôi đi bộ đi làm."],[["我","每天","坐","校车","上学"],"Mỗi ngày tôi đi học bằng xe buýt trường."],[["你爸爸","怎么","上班"],"Bố bạn đi làm bằng gì?"],[["我","坐","地铁","上学"],"Tôi đi học bằng tàu điện ngầm."],[["你哥哥","怎么","上学"],"Anh trai bạn đi học bằng gì?"]]};
const TR=[["坐校车","xe buýt trường"],["坐火车","tàu hỏa"],["坐出租车","taxi"],["坐公共汽车","xe buýt công cộng"],["坐地铁","tàu điện ngầm"],["坐电车","xe điện"],["坐飞机","máy bay"],["坐渡船","phà"],["开车","tự lái xe"],["走路","đi bộ"]];
const HQ=[["我爸爸开车上班。","你爸爸怎么上班？"],["我妈妈走路上班。","你妈妈怎么上班？"],["我每天坐校车上学。","你怎么上学？"],["他们八点上课。","你们几点上课？"]];
const SG=[];

/* ===== HÀM TIỆN ÍCH ===== */
const $=s=>document.querySelector(s);
const R=a=>a[Math.random()*a.length|0];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cn=n=>n<10?DG[n]:n<20?"十"+(n%10?DG[n%10]:""):DG[n/10|0]+"十"+(n%10?DG[n%10]:"");
const wd=x=>"星期"+WD[(x+4)%7]; // 2/9/2006 là thứ Bảy
const pick=(arr,a,k=3)=>sh([...new Set(arr)].filter(x=>x!==a)).slice(0,k);
const mk=(q,a,wr,tip,big,py,sm)=>({t:"c",q,a,o:sh([a,...wr.slice(0,3)]),tip,big,py,sm});

/* ===== BỘ SINH CÂU HỎI ===== */
const G={
 vm:()=>{const W=X.W,w=R(W);return mk("Nghĩa của từ này là gì?",w[2],pick(W.map(x=>x[2]),w[2]),`${w[0]} (${w[1]}) = ${w[2]}`,w[0],w[1])},
 vr:()=>{const W=X.W,w=R(W);return mk("Chọn chữ Hán đúng cho nghĩa này:",w[0],pick(W.map(x=>x[0]),w[0]),`${w[2]} = ${w[0]} (${w[1]})`,w[2],"",1)},
 pm:()=>{const W=X.W,w=R(W);return mk("Chọn pinyin đúng:",w[1],pick(W.map(x=>x[1]),w[1]),`${w[0]} đọc là ${w[1]}`,w[0])},
 tf:()=>{const W=X.W,w=R(W),ok=Math.random()<.5,m=ok?w[2]:R(W.filter(x=>x[2]!==w[2]))[2];return mk("Đúng hay sai?",ok?"Đúng":"Sai",[ok?"Sai":"Đúng"],`${w[0]} (${w[1]}) = ${w[2]}`,`${w[0]} = ${m}`,"",1)},
 m:()=>({t:"m",p:sh(X.W).slice(0,5)}),
 fl:()=>{const x=R(X.F);return mk("Chọn từ điền vào chỗ trống:",x[1],x[2],x[0].replace("___",x[1]),x[0],"",1)},
 rad:()=>{const RA=X.RA,x=R(RA),f=r=>`${r[1]} (${r[2]})`;return mk("Bộ thủ của chữ này là gì?",f(x),pick(RA.map(f),f(x)),`${x[0]}: bộ ${x[1]} (${x[2]})`,x[0])},
 ord:()=>{const s=R(X.S);return {t:"o",w:sh(s[0]),a:s[0].join(""),vi:s[1],tip:s[0].join("")+" — "+s[1]}},
 st:()=>{const x=R(X.ST);return mk("Chữ này có cấu trúc nào?",x[1],pick(["trái – phải","trên – dưới","bao quanh"],x[1],2),`${x[0]}: ${x[1]}`,x[0])},
 tr:()=>{const x=R(TR),a=`${x[0]}上班。`;return mk(`Bạn đi làm bằng: ${x[1]}. Trả lời 你怎么上班？`,a,pick(TR.map(y=>`${y[0]}上班。`),a),`${a} (${x[1]})`)},
 ev:()=>{const p=R([["我爸爸","bố tôi"],["我妈妈","mẹ tôi"],["我哥哥","anh trai tôi"]]),x=R(TR),a=`${p[0]}每天${x[0]}上班。`;
  return mk(`${p[1]} mỗi ngày đi làm bằng ${x[1]}. Chọn câu đúng:`,a,pick([`${p[0]}${x[0]}每天上班。`,`${p[0]}每天上班${x[0]}。`,`${p[0]}每天${R(TR.filter(y=>y!=x))[0]}上班。`],a),a+" (每天 đứng trước động từ)")},
 hq:()=>{const x=R(HQ);return mk("Chọn câu hỏi phù hợp với câu trả lời:",x[1],pick(HQ.map(y=>y[1]),x[1]),`${x[0]} ← ${x[1]}`,x[0],"",1)},
 _:0
};
const LV=[["Từ mới",["m","vm","vm","tf","vr","tf","vm","m"]],["Pinyin & chữ Hán",["pm","vr","pm","vr","pm","vr","pm","vr"]],["Phương tiện",["tr","tr","ev","tr","ev","fl","ev","tr"]],["Hỏi cách đi",["hq","hq","tr","hq","fl","ev","hq","tr"]],["Ghép câu",["ord","ord","ord","ord","ord","fl"]],["Bộ thủ",["rad","rad","rad","rad","rad","rad","rad","rad"]],["Boss",["vm","vr","tr","ev","hq","fl","ord","rad","fl","tf"]]];

/* ===== LƯU TIẾN ĐỘ ===== */
let DB={users:{},cur:"",py:true,hard:false};
try{const j=JSON.parse(localStorage.getItem("es1l12b"));if(j&&j.users)DB=Object.assign(DB,j)}catch(e){}
let S={},st=null;
const save=()=>{try{localStorage.setItem("es1l12b",JSON.stringify(DB))}catch(e){}};
function use(n){DB.cur=n;S=DB.users[n]=DB.users[n]||{};S.done=S.done||{};S.acc=S.acc||{};S.xp=S.xp||0;S.streak=S.streak||0;save()}
if(DB.cur&&DB.users[DB.cur])use(DB.cur);else DB.cur="";

/* ===== MÀN HÌNH CHÍNH ===== */
function home(){
 if(st)clearInterval(st.iv);
 if(!DB.cur)return login();
 document.body.classList.toggle("nopy",!DB.py);
 const dn=k=>(S.done[k]||0)>=1,stars=k=>"★".repeat(S.done[k]||0)+"☆".repeat(3-(S.done[k]||0));
 const bd=(S.done[LID+"-2"]||0)>=3?["Tài xế giỏi"]:[];
 let h=`<h1>Bài ${LID} · Phương tiện giao thông</h1><p class="sub">Easy Steps to Chinese 1 · Unit 4</p>
 <p class="sub">👤 Học sinh: <b>${DB.cur}</b></p>
 <div class="tools"><button class="tg" onclick="DB.py=!DB.py;save();home()">Pinyin: ${DB.py?"bật":"tắt"}</button><button class="tg" onclick="DB.hard=!DB.hard;save();home()">Chế độ: ${DB.hard?"Thử thách (3 ❤️)":"Luyện tập (không mất tim)"}</button><button class="tg" onclick="report()">📋 Báo cáo điểm</button><button class="tg" onclick="DB.cur='';save();home()">Đổi học sinh</button><button class="tg" onclick="resetMe()">Làm lại từ đầu</button></div>
 <p class="xp">⭐ ${S.xp} XP · 🔥 ${S.streak} ngày liên tiếp</p>${bd.length?`<div class="badges">${bd.map(b=>`<span class="bd">🏅 ${b}</span>`).join("")}</div>`:""}
 <section class="card"><h2>交通工具 Phương tiện giao thông</h2><div class="note">怎么 hỏi cách thức: 你怎么上学？ 坐 + phương tiện (坐火车); 开车 và 走路 không dùng 坐. 每天 đứng trước động từ.</div><div class="grid">`;
 LV.forEach((v,i)=>{const lock=i>0&&!dn(LID+"-"+(i-1));
  h+=`<button class="lv ${i==6?"boss":""}" ${lock?"disabled":""} onclick="play(${i})"><b>${i==6?"👹":i+1}</b><span>${v[0]}</span><em>${lock?"🔒":stars(LID+"-"+i)}</em></button>`});
 $("#app").innerHTML=h+`</div></section>`;scrollTo(0,0)}

/* ===== ĐIỀU KHIỂN LƯỢT CHƠI ===== */
function play(i){run(LV[i][1].map(g=>G[g]()),{key:LID+"-"+i,again:()=>play(i)})}
function run(qs,o){
 if(st)clearInterval(st.iv);
 st={qs,i:0,ok:0,hp:DB.hard&&!o.speed&&!o.review?3:99,hard:DB.hard&&!o.speed&&!o.review,combo:0,miss:[],pts:0,t:60,o,speed:o.speed};
 if(o.speed)st.iv=setInterval(()=>{st.t--;const e=$("#tm");if(e)e.textContent=st.t+"s";const b=$(".bar i");if(b)b.style.width=(60-st.t)/60*100+"%";if(st.t<=0)end()},1000);
 show()}
function quit(){if(confirm("Thoát màn chơi? Tiến độ màn này sẽ không được lưu."))home()}
function show(){
 if(st.speed&&!st.qs[st.i])st.qs[st.i]=G[R(SG)](R([5,6]));
 if((!st.speed&&st.i>=st.qs.length)||st.hp<=0)return end();
 const q=st.q=st.qs[st.i];st.lock=false;
 const pr=st.speed?(60-st.t)/60:st.i/st.qs.length;
 let h=`<div class="top"><button class="ghost" onclick="quit()" aria-label="Thoát">✕</button><div class="bar"><i style="width:${pr*100}%"></i></div><span>${st.hard?"❤️".repeat(st.hp):""}</span>${st.speed?`<b id="tm">${st.t}s</b><b>${st.pts}đ</b>`:""}</div><main>`;
 if(q.t=="c"){
  h+=`<p class="q">${q.q}</p>${q.big?`<div class="big ${q.sm?"s":""}">${q.big}${q.py?`<small class="py">${q.py}</small>`:""}</div>`:""}<div class="opts">${q.o.map((o,k)=>`<button class="opt" onclick="pickC(${k})">${o}</button>`).join("")}</div>`}
 if(q.t=="o"){
  st.pk=[];h+=`<p class="q">Sắp xếp thành câu: <i>${q.vi}</i></p><div id="ans" class="slot"></div><div id="pool" class="pool"></div><button class="go" onclick="chkO()">Kiểm tra</button>`}
 if(q.t=="m"){
  st.sel=null;st.n=0;st.mm=0;st.ls=sh(q.p.map((_,k)=>k));st.rs=sh(q.p.map((_,k)=>k));
  h+=`<p class="q">Nối chữ Hán với nghĩa tiếng Việt:</p><div class="mm"><div>${st.ls.map(k=>`<button id="l${k}" onclick="selM(${k})"><span class="zh">${q.p[k][0]}</span><span class="py">${q.p[k][1]}</span></button>`).join("")}</div><div>${st.rs.map(k=>`<button id="r${k}" onclick="mtch(${k})">${q.p[k][2]}</button>`).join("")}</div></div>`}
 $("#app").innerHTML=h+"</main>";
 if(q.t=="o")drawO()}
function res(ok,q,tip){
 if(st.lock)return;st.lock=true;
 if(ok){st.ok++;st.combo++;st.pts+=10+Math.min(st.combo,5)*2}else{st.combo=0;st.miss.push(q);if(st.hard)st.hp--}
 if(st.speed){setTimeout(()=>{st.i++;show()},ok?250:800);return}
 $("main").insertAdjacentHTML("beforeend",`<div class="fb ${ok?"good":"bad"}"><b>${ok?"Đúng rồi!"+(st.combo>2?" 🔥 combo ×"+st.combo:""):"Chưa đúng"}</b><p>${tip||""}</p><button class="go" onclick="st.i++;show()">${st.hp<=0?"Xem kết quả":"Tiếp tục"}</button></div>`);
 $(".fb .go").focus()}
function pickC(k){
 if(st.lock)return;const q=st.q,a=q.o[k],ok=a===q.a;
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.o[j]===q.a)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
 res(ok,q,q.tip)}
function drawO(){const q=st.q;
 $("#ans").innerHTML=st.pk.map(k=>`<button class="chip" onclick="st.pk=st.pk.filter(x=>x!=${k});drawO()">${q.w[k]}</button>`).join("");
 $("#pool").innerHTML=q.w.map((w,k)=>st.pk.includes(k)?"":`<button class="chip" onclick="st.pk.push(${k});drawO()">${w}</button>`).join("")}
function chkO(){
 if(st.lock||st.pk.length<st.q.w.length)return;
 res(st.pk.map(k=>st.q.w[k]).join("")===st.q.a,st.q,st.q.tip)}
function selM(k){if(st.lock)return;document.querySelectorAll("[id^=l]").forEach(b=>b.classList.remove("sel"));st.sel=k;$("#l"+k).classList.add("sel")}
function mtch(k){
 if(st.lock||st.sel===null)return;const b=$("#r"+k);
 if(k===st.sel){b.classList.add("ok");b.disabled=true;$("#l"+k).classList.add("ok");$("#l"+k).disabled=true;st.sel=null;st.n++;
  if(st.n==st.q.p.length)res(st.mm==0,st.q,st.mm?"Hoàn thành, nhưng có "+st.mm+" lần nối sai.":"Nối đúng hết!")}
 else{st.mm++;b.classList.add("no");setTimeout(()=>b.classList.remove("no"),500);if(st.hard){st.hp--;if(st.hp<=0){st.miss.push(st.q);st.lock=true;end()}}}}

/* ===== KẾT QUẢ ===== */
function end(){
 clearInterval(st.iv);const o=st.o,n=st.qs.length,dead=st.hp<=0;
 let s=0;
 if(st.speed)s=st.pts>=250?3:st.pts>=150?2:st.pts>=60?1:0;
 else if(!dead){const a=st.ok/n;s=a>=.9?3:a>=.7?2:a>=.5?1:0}
 if(!o.review){if(o.key&&!st.speed)S.acc[o.key]=Math.max(S.acc[o.key]||0,Math.round(st.ok/n*100));if(o.key&&s>0)S.done[o.key]=Math.max(S.done[o.key]||0,s);if(st.speed)S.best=Math.max(S.best||0,st.pts)}
 S.xp+=st.pts;
 const td=new Date().toDateString();
 if(S.last!==td){S.streak=S.last===new Date(Date.now()-864e5).toDateString()?S.streak+1:1;S.last=td}
 save();
 const miss=st.miss.filter(q=>q.t!="m");
 $("#app").innerHTML=`<div class="res card"><h2>${st.speed?"Hết giờ!":dead?"Hết tim":s>0?"Hoàn thành!":"Chưa đạt"}</h2><div class="stars">${"★".repeat(s)}${"☆".repeat(3-s)}</div>
 <p>${st.speed?`Điểm: <b>${st.pts}</b> (cao nhất ${S.best})`:`Đúng ${st.ok}/${n} · +${st.pts} XP`}</p>
 ${!st.speed&&s==0?"<p>Cần đúng ít nhất một nửa để qua màn.</p>":""}
 ${o.review?"":`<button class="go" onclick="st.o.again()">Chơi lại</button>`}
 ${miss.length&&!o.review?`<button class="go alt" onclick="run(sh(st.miss.filter(q=>q.t!='m')),{review:1,again:home})">Ôn lại ${miss.length} câu sai</button>`:""}
 <br><button class="go alt" onclick="home()">Về bản đồ</button></div>`}
/* ===== HỌC SINH, BÁO CÁO, LÀM LẠI ===== */
function login(){
 const us=Object.keys(DB.users);
 $("#app").innerHTML=`<h1>Chào mừng bạn!</h1><p class="sub">Nhập tên để lưu điểm của riêng bạn.</p><div class="card"><input id="nm" class="inp" maxlength="30" placeholder="Tên học sinh" onkeydown="if(event.key==='Enter')go()"><button class="go" onclick="go()">Bắt đầu học</button>${us.length?`<p>Hoặc chọn tên đã có trên máy này:</p><div class="tools">${us.map((u,i)=>`<button class="tg" onclick="use(Object.keys(DB.users)[${i}]);home()">${u}</button>`).join("")}</div>`:""}</div><button class="tg" onclick="report()">📋 Báo cáo cả lớp</button>`}
function go(){const n=$("#nm").value.trim().replace(/[<>"'&`]/g,"");if(!n){$("#nm").focus();return}use(n);home()}
function rep(u){const d=DB.users[u],c=Object.keys(d.done||{}).filter(k=>k!="u"&&d.done[k]>0).length;return `${u}: ${c}/7 màn đạt · ${d.xp||0} XP`}
function report(){
 const L=["BÁO CÁO BÀI 12 – PHƯƠNG TIỆN GIAO THÔNG – "+new Date().toLocaleDateString("vi-VN"),"","TỔNG HỢP CẢ LỚP (các học sinh trên máy này):",...Object.keys(DB.users).map(rep)];
 if(DB.cur){L.push("","CHI TIẾT: "+DB.cur);
  for(const l of [LID]){L.push("Bài "+l+":");LV.forEach((v,i)=>{const k=l+"-"+i,s=S.done[k]||0;L.push(`  ${v[0]}: ${s?"★".repeat(s):"chưa đạt"}${S.acc[k]!=null?" ("+S.acc[k]+"% đúng)":""}`)})}
  }
 $("#app").innerHTML=`<h1>Báo cáo điểm</h1><p class="sub">Sao chép và gửi cho giáo viên (qua Zalo, email...).</p><div class="card"><textarea id="rp" readonly></textarea><button class="go" onclick="cp()">Sao chép kết quả</button> <span id="cm"></span></div><button class="go alt" onclick="home()">Quay lại</button> <button class="go alt" onclick="clearAll()">Xóa dữ liệu cả máy</button>`;
 $("#rp").value=L.join("\n")}
function cp(){const t=$("#rp");t.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}$("#cm").textContent=ok?"Đã sao chép!":"Chưa sao chép được, hãy nhấn giữ và chọn Sao chép."}
function resetMe(){if(confirm("Xóa toàn bộ điểm của "+DB.cur+" và làm lại từ đầu?")){delete DB.users[DB.cur];use(DB.cur);home()}}
function clearAll(){if(confirm("Xóa điểm của TẤT CẢ học sinh trên máy này?")){DB.users={};DB.cur="";save();home()}}
home();
</script></body></html>

<title>Easy Steps 1 – Bài 13: Màu sắc</title>
<style>

<body><div id="app"></div>
<script>
/* ===== DỮ LIỆU (Bài 13) ===== */
const LID=13,DG="〇一二三四五六七八九";
const jn=l=>l.length<2?l.join(""):l.slice(0,-1).join("、")+"和"+l[l.length-1];
const CL=[["黑色","đen"],["白色","trắng"],["黄色","vàng"],["蓝色","xanh dương"],["红色","đỏ"],["粉红色","hồng"],["橙色","cam"],["紫色","tím"],["棕色","nâu"],["绿色","xanh lá"],["灰色","xám"]];
const X={
W:[["喜欢","xǐhuan","thích"],["黑色","hēisè","màu đen"],["白色","báisè","màu trắng"],["黄色","huángsè","màu vàng"],["蓝色","lánsè","màu xanh dương"],["红色","hóngsè","màu đỏ"],["粉红色","fěnhóngsè","màu hồng"],["颜色","yánsè","màu sắc"],["橙色","chéngsè","màu cam"],["紫色","zǐsè","màu tím"],["棕色","zōngsè","màu nâu"],["绿色","lǜsè","màu xanh lá"],["灰色","huīsè","màu xám"],["天蓝色","tiānlánsè","màu xanh da trời"]],
RA:[["病","疒","bệnh"],["炒","火","lửa"],["爱","爫","móng vuốt"],["弹","弓","cung"],["加","力","sức"],["视","礻","lễ"]],
F:[["我爸爸 ___ 黑色和白色。","喜欢",["颜色","不","也"]],["你喜欢什么 ___？","颜色",["喜欢","什么","绿色"]],["你喜欢灰色吗？不 ___。","喜欢",["颜色","也","吗"]],["我 ___ 不喜欢。","也",["和","吗","色"]],["黑色 ___ 火车","的",["吗","也","和"]]],
S:[[["我爸爸","喜欢","黑色","和","白色"],"Bố tôi thích màu đen và màu trắng."],[["我妈妈","喜欢","黄色"],"Mẹ tôi thích màu vàng."],[["你","喜欢","什么","颜色"],"Bạn thích màu gì?"],[["你","喜欢","灰色","吗"],"Bạn có thích màu xám không?"],[["我","也","不","喜欢"],"Tôi cũng không thích."],[["我","喜欢","粉红色"],"Tôi thích màu hồng."]]};
const PP=[["我爸爸","bố tôi"],["我妈妈","mẹ tôi"],["我哥哥","anh trai tôi"],["我姐姐","chị gái tôi"],["我","tôi"]];
const NN=[["火车","tàu hỏa"],["公共汽车","xe buýt"],["飞机","máy bay"],["出租车","taxi"],["校车","xe buýt trường"],["汽车","ô tô"]];
const MX=[["红色","黄色","橙色"],["白色","黑色","灰色"],["蓝色","黄色","绿色"],["白色","蓝色","天蓝色"],["紫色","黄色","棕色"],["红色","蓝色","紫色"],["白色","红色","粉红色"]];
const YK=[["bạn thích","喜欢。"],["bạn không thích","不喜欢。"],["bạn cũng không thích","我也不喜欢。"],["bạn cũng thích","我也喜欢。"]];
const SG=[];

/* ===== HÀM TIỆN ÍCH ===== */
const $=s=>document.querySelector(s);
const R=a=>a[Math.random()*a.length|0];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cn=n=>n<10?DG[n]:n<20?"十"+(n%10?DG[n%10]:""):DG[n/10|0]+"十"+(n%10?DG[n%10]:"");
const wd=x=>"星期"+WD[(x+4)%7]; // 2/9/2006 là thứ Bảy
const pick=(arr,a,k=3)=>sh([...new Set(arr)].filter(x=>x!==a)).slice(0,k);
const mk=(q,a,wr,tip,big,py,sm)=>({t:"c",q,a,o:sh([a,...wr.slice(0,3)]),tip,big,py,sm});

/* ===== BỘ SINH CÂU HỎI ===== */
const G={
 vm:()=>{const W=X.W,w=R(W);return mk("Nghĩa của từ này là gì?",w[2],pick(W.map(x=>x[2]),w[2]),`${w[0]} (${w[1]}) = ${w[2]}`,w[0],w[1])},
 vr:()=>{const W=X.W,w=R(W);return mk("Chọn chữ Hán đúng cho nghĩa này:",w[0],pick(W.map(x=>x[0]),w[0]),`${w[2]} = ${w[0]} (${w[1]})`,w[2],"",1)},
 pm:()=>{const W=X.W,w=R(W);return mk("Chọn pinyin đúng:",w[1],pick(W.map(x=>x[1]),w[1]),`${w[0]} đọc là ${w[1]}`,w[0])},
 tf:()=>{const W=X.W,w=R(W),ok=Math.random()<.5,m=ok?w[2]:R(W.filter(x=>x[2]!==w[2]))[2];return mk("Đúng hay sai?",ok?"Đúng":"Sai",[ok?"Sai":"Đúng"],`${w[0]} (${w[1]}) = ${w[2]}`,`${w[0]} = ${m}`,"",1)},
 m:()=>({t:"m",p:sh(X.W).slice(0,5)}),
 fl:()=>{const x=R(X.F);return mk("Chọn từ điền vào chỗ trống:",x[1],x[2],x[0].replace("___",x[1]),x[0],"",1)},
 rad:()=>{const RA=X.RA,x=R(RA),f=r=>`${r[1]} (${r[2]})`;return mk("Bộ thủ của chữ này là gì?",f(x),pick(RA.map(f),f(x)),`${x[0]}: bộ ${x[1]} (${x[2]})`,x[0])},
 ord:()=>{const s=R(X.S);return {t:"o",w:sh(s[0]),a:s[0].join(""),vi:s[1],tip:s[0].join("")+" — "+s[1]}},
 st:()=>{const x=R(X.ST);return mk("Chữ này có cấu trúc nào?",x[1],pick(["trái – phải","trên – dưới","bao quanh"],x[1],2),`${x[0]}: ${x[1]}`,x[0])},
 lk:()=>{const p=R(PP),n=1+(Math.random()<.5),c=sh(CL).slice(0,n),ans=`${p[0]}喜欢${jn(c.map(x=>x[0]))}。`;
  return mk(`${p[1]} thích màu ${c.map(x=>x[1]).join(" và ")}. Chọn câu đúng:`,ans,pick([`${p[0]}喜欢${jn(sh(CL).slice(0,n).map(x=>x[0]))}。`,`${p[0]}${jn(c.map(x=>x[0]))}喜欢。`,`${R(PP)[0]}喜欢${jn(sh(CL).slice(0,n).map(x=>x[0]))}。`],ans),ans)},
 dn:()=>{const c=R(CL),n=R(NN),a=`${c[0]}的${n[0]}`;return mk(`${n[1]} màu ${c[1]}. Nói bằng tiếng Trung:`,a,pick([`${n[0]}的${c[0]}`,`${R(CL)[0]}的${n[0]}`,`${c[0]}${n[0]}的`],a),a)},
 yn13:()=>{const c=R(CL),y=R(YK),a=y[1];return mk(`你喜欢${c[0]}吗？ (${c[1]}) Ý bạn: ${y[0]} màu này. Trả lời:`,a,pick(YK.map(x=>x[1]),a),a)},
 mix:()=>{const x=R(MX);return mk("Pha màu — kết quả là màu gì?",x[2],pick(["橙色","灰色","绿色","天蓝色","棕色","紫色","粉红色","黑色"],x[2]),`${x[0]} + ${x[1]} = ${x[2]}`,`${x[0]} + ${x[1]}`,"",1)},
 _:0
};
const LV=[["Từ mới",["m","vm","vm","tf","vr","tf","vm","m"]],["Pinyin & chữ Hán",["pm","vr","pm","vr","pm","vr","pm","vr"]],["Màu sắc",["lk","dn","lk","dn","yn13","lk","dn","yn13"]],["Pha màu",["mix","mix","mix","mix","mix","mix","fl","vr"]],["Ghép câu",["ord","ord","ord","ord","ord","fl"]],["Bộ thủ",["rad","rad","rad","rad","rad","rad","rad","rad"]],["Boss",["vm","vr","lk","dn","yn13","mix","ord","rad","fl","tf"]]];

/* ===== LƯU TIẾN ĐỘ ===== */
let DB={users:{},cur:"",py:true,hard:false};
try{const j=JSON.parse(localStorage.getItem("es1l13b"));if(j&&j.users)DB=Object.assign(DB,j)}catch(e){}
let S={},st=null;
const save=()=>{try{localStorage.setItem("es1l13b",JSON.stringify(DB))}catch(e){}};
function use(n){DB.cur=n;S=DB.users[n]=DB.users[n]||{};S.done=S.done||{};S.acc=S.acc||{};S.xp=S.xp||0;S.streak=S.streak||0;save()}
if(DB.cur&&DB.users[DB.cur])use(DB.cur);else DB.cur="";

/* ===== MÀN HÌNH CHÍNH ===== */
function home(){
 if(st)clearInterval(st.iv);
 if(!DB.cur)return login();
 document.body.classList.toggle("nopy",!DB.py);
 const dn=k=>(S.done[k]||0)>=1,stars=k=>"★".repeat(S.done[k]||0)+"☆".repeat(3-(S.done[k]||0));
 const bd=(S.done[LID+"-3"]||0)>=3?["Họa sĩ nhí"]:[];
 let h=`<h1>Bài ${LID} · Màu sắc</h1><p class="sub">Easy Steps to Chinese 1 · Unit 5</p>
 <p class="sub">👤 Học sinh: <b>${DB.cur}</b></p>
 <div class="tools"><button class="tg" onclick="DB.py=!DB.py;save();home()">Pinyin: ${DB.py?"bật":"tắt"}</button><button class="tg" onclick="DB.hard=!DB.hard;save();home()">Chế độ: ${DB.hard?"Thử thách (3 ❤️)":"Luyện tập (không mất tim)"}</button><button class="tg" onclick="report()">📋 Báo cáo điểm</button><button class="tg" onclick="DB.cur='';save();home()">Đổi học sinh</button><button class="tg" onclick="resetMe()">Làm lại từ đầu</button></div>
 <p class="xp">⭐ ${S.xp} XP · 🔥 ${S.streak} ngày liên tiếp</p>${bd.length?`<div class="badges">${bd.map(b=>`<span class="bd">🏅 ${b}</span>`).join("")}</div>`:""}
 <section class="card"><h2>颜色 Màu sắc</h2><div class="note">Màu + 的 + danh từ: 黑色的火车. Phủ định: 不喜欢; thêm 也: 我也不喜欢. Liệt kê: 黑色和白色.</div><div class="grid">`;
 LV.forEach((v,i)=>{const lock=i>0&&!dn(LID+"-"+(i-1));
  h+=`<button class="lv ${i==6?"boss":""}" ${lock?"disabled":""} onclick="play(${i})"><b>${i==6?"👹":i+1}</b><span>${v[0]}</span><em>${lock?"🔒":stars(LID+"-"+i)}</em></button>`});
 $("#app").innerHTML=h+`</div></section>`;scrollTo(0,0)}

/* ===== ĐIỀU KHIỂN LƯỢT CHƠI ===== */
function play(i){run(LV[i][1].map(g=>G[g]()),{key:LID+"-"+i,again:()=>play(i)})}
function run(qs,o){
 if(st)clearInterval(st.iv);
 st={qs,i:0,ok:0,hp:DB.hard&&!o.speed&&!o.review?3:99,hard:DB.hard&&!o.speed&&!o.review,combo:0,miss:[],pts:0,t:60,o,speed:o.speed};
 if(o.speed)st.iv=setInterval(()=>{st.t--;const e=$("#tm");if(e)e.textContent=st.t+"s";const b=$(".bar i");if(b)b.style.width=(60-st.t)/60*100+"%";if(st.t<=0)end()},1000);
 show()}
function quit(){if(confirm("Thoát màn chơi? Tiến độ màn này sẽ không được lưu."))home()}
function show(){
 if(st.speed&&!st.qs[st.i])st.qs[st.i]=G[R(SG)](R([5,6]));
 if((!st.speed&&st.i>=st.qs.length)||st.hp<=0)return end();
 const q=st.q=st.qs[st.i];st.lock=false;
 const pr=st.speed?(60-st.t)/60:st.i/st.qs.length;
 let h=`<div class="top"><button class="ghost" onclick="quit()" aria-label="Thoát">✕</button><div class="bar"><i style="width:${pr*100}%"></i></div><span>${st.hard?"❤️".repeat(st.hp):""}</span>${st.speed?`<b id="tm">${st.t}s</b><b>${st.pts}đ</b>`:""}</div><main>`;
 if(q.t=="c"){
  h+=`<p class="q">${q.q}</p>${q.big?`<div class="big ${q.sm?"s":""}">${q.big}${q.py?`<small class="py">${q.py}</small>`:""}</div>`:""}<div class="opts">${q.o.map((o,k)=>`<button class="opt" onclick="pickC(${k})">${o}</button>`).join("")}</div>`}
 if(q.t=="o"){
  st.pk=[];h+=`<p class="q">Sắp xếp thành câu: <i>${q.vi}</i></p><div id="ans" class="slot"></div><div id="pool" class="pool"></div><button class="go" onclick="chkO()">Kiểm tra</button>`}
 if(q.t=="m"){
  st.sel=null;st.n=0;st.mm=0;st.ls=sh(q.p.map((_,k)=>k));st.rs=sh(q.p.map((_,k)=>k));
  h+=`<p class="q">Nối chữ Hán với nghĩa tiếng Việt:</p><div class="mm"><div>${st.ls.map(k=>`<button id="l${k}" onclick="selM(${k})"><span class="zh">${q.p[k][0]}</span><span class="py">${q.p[k][1]}</span></button>`).join("")}</div><div>${st.rs.map(k=>`<button id="r${k}" onclick="mtch(${k})">${q.p[k][2]}</button>`).join("")}</div></div>`}
 $("#app").innerHTML=h+"</main>";
 if(q.t=="o")drawO()}
function res(ok,q,tip){
 if(st.lock)return;st.lock=true;
 if(ok){st.ok++;st.combo++;st.pts+=10+Math.min(st.combo,5)*2}else{st.combo=0;st.miss.push(q);if(st.hard)st.hp--}
 if(st.speed){setTimeout(()=>{st.i++;show()},ok?250:800);return}
 $("main").insertAdjacentHTML("beforeend",`<div class="fb ${ok?"good":"bad"}"><b>${ok?"Đúng rồi!"+(st.combo>2?" 🔥 combo ×"+st.combo:""):"Chưa đúng"}</b><p>${tip||""}</p><button class="go" onclick="st.i++;show()">${st.hp<=0?"Xem kết quả":"Tiếp tục"}</button></div>`);
 $(".fb .go").focus()}
function pickC(k){
 if(st.lock)return;const q=st.q,a=q.o[k],ok=a===q.a;
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.o[j]===q.a)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
 res(ok,q,q.tip)}
function drawO(){const q=st.q;
 $("#ans").innerHTML=st.pk.map(k=>`<button class="chip" onclick="st.pk=st.pk.filter(x=>x!=${k});drawO()">${q.w[k]}</button>`).join("");
 $("#pool").innerHTML=q.w.map((w,k)=>st.pk.includes(k)?"":`<button class="chip" onclick="st.pk.push(${k});drawO()">${w}</button>`).join("")}
function chkO(){
 if(st.lock||st.pk.length<st.q.w.length)return;
 res(st.pk.map(k=>st.q.w[k]).join("")===st.q.a,st.q,st.q.tip)}
function selM(k){if(st.lock)return;document.querySelectorAll("[id^=l]").forEach(b=>b.classList.remove("sel"));st.sel=k;$("#l"+k).classList.add("sel")}
function mtch(k){
 if(st.lock||st.sel===null)return;const b=$("#r"+k);
 if(k===st.sel){b.classList.add("ok");b.disabled=true;$("#l"+k).classList.add("ok");$("#l"+k).disabled=true;st.sel=null;st.n++;
  if(st.n==st.q.p.length)res(st.mm==0,st.q,st.mm?"Hoàn thành, nhưng có "+st.mm+" lần nối sai.":"Nối đúng hết!")}
 else{st.mm++;b.classList.add("no");setTimeout(()=>b.classList.remove("no"),500);if(st.hard){st.hp--;if(st.hp<=0){st.miss.push(st.q);st.lock=true;end()}}}}

/* ===== KẾT QUẢ ===== */
function end(){
 clearInterval(st.iv);const o=st.o,n=st.qs.length,dead=st.hp<=0;
 let s=0;
 if(st.speed)s=st.pts>=250?3:st.pts>=150?2:st.pts>=60?1:0;
 else if(!dead){const a=st.ok/n;s=a>=.9?3:a>=.7?2:a>=.5?1:0}
 if(!o.review){if(o.key&&!st.speed)S.acc[o.key]=Math.max(S.acc[o.key]||0,Math.round(st.ok/n*100));if(o.key&&s>0)S.done[o.key]=Math.max(S.done[o.key]||0,s);if(st.speed)S.best=Math.max(S.best||0,st.pts)}
 S.xp+=st.pts;
 const td=new Date().toDateString();
 if(S.last!==td){S.streak=S.last===new Date(Date.now()-864e5).toDateString()?S.streak+1:1;S.last=td}
 save();
 const miss=st.miss.filter(q=>q.t!="m");
 $("#app").innerHTML=`<div class="res card"><h2>${st.speed?"Hết giờ!":dead?"Hết tim":s>0?"Hoàn thành!":"Chưa đạt"}</h2><div class="stars">${"★".repeat(s)}${"☆".repeat(3-s)}</div>
 <p>${st.speed?`Điểm: <b>${st.pts}</b> (cao nhất ${S.best})`:`Đúng ${st.ok}/${n} · +${st.pts} XP`}</p>
 ${!st.speed&&s==0?"<p>Cần đúng ít nhất một nửa để qua màn.</p>":""}
 ${o.review?"":`<button class="go" onclick="st.o.again()">Chơi lại</button>`}
 ${miss.length&&!o.review?`<button class="go alt" onclick="run(sh(st.miss.filter(q=>q.t!='m')),{review:1,again:home})">Ôn lại ${miss.length} câu sai</button>`:""}
 <br><button class="go alt" onclick="home()">Về bản đồ</button></div>`}
/* ===== HỌC SINH, BÁO CÁO, LÀM LẠI ===== */
function login(){
 const us=Object.keys(DB.users);
 $("#app").innerHTML=`<h1>Chào mừng bạn!</h1><p class="sub">Nhập tên để lưu điểm của riêng bạn.</p><div class="card"><input id="nm" class="inp" maxlength="30" placeholder="Tên học sinh" onkeydown="if(event.key==='Enter')go()"><button class="go" onclick="go()">Bắt đầu học</button>${us.length?`<p>Hoặc chọn tên đã có trên máy này:</p><div class="tools">${us.map((u,i)=>`<button class="tg" onclick="use(Object.keys(DB.users)[${i}]);home()">${u}</button>`).join("")}</div>`:""}</div><button class="tg" onclick="report()">📋 Báo cáo cả lớp</button>`}
function go(){const n=$("#nm").value.trim().replace(/[<>"'&`]/g,"");if(!n){$("#nm").focus();return}use(n);home()}
function rep(u){const d=DB.users[u],c=Object.keys(d.done||{}).filter(k=>k!="u"&&d.done[k]>0).length;return `${u}: ${c}/7 màn đạt · ${d.xp||0} XP`}
function report(){
 const L=["BÁO CÁO BÀI 13 – MÀU SẮC – "+new Date().toLocaleDateString("vi-VN"),"","TỔNG HỢP CẢ LỚP (các học sinh trên máy này):",...Object.keys(DB.users).map(rep)];
 if(DB.cur){L.push("","CHI TIẾT: "+DB.cur);
  for(const l of [LID]){L.push("Bài "+l+":");LV.forEach((v,i)=>{const k=l+"-"+i,s=S.done[k]||0;L.push(`  ${v[0]}: ${s?"★".repeat(s):"chưa đạt"}${S.acc[k]!=null?" ("+S.acc[k]+"% đúng)":""}`)})}
  }
 $("#app").innerHTML=`<h1>Báo cáo điểm</h1><p class="sub">Sao chép và gửi cho giáo viên (qua Zalo, email...).</p><div class="card"><textarea id="rp" readonly></textarea><button class="go" onclick="cp()">Sao chép kết quả</button> <span id="cm"></span></div><button class="go alt" onclick="home()">Quay lại</button> <button class="go alt" onclick="clearAll()">Xóa dữ liệu cả máy</button>`;
 $("#rp").value=L.join("\n")}
function cp(){const t=$("#rp");t.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}$("#cm").textContent=ok?"Đã sao chép!":"Chưa sao chép được, hãy nhấn giữ và chọn Sao chép."}
function resetMe(){if(confirm("Xóa toàn bộ điểm của "+DB.cur+" và làm lại từ đầu?")){delete DB.users[DB.cur];use(DB.cur);home()}}
function clearAll(){if(confirm("Xóa điểm của TẤT CẢ học sinh trên máy này?")){DB.users={};DB.cur="";save();home()}}
home();
</script></body></html>
